<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ==========================================
    // 0. CONFIGURACIÓ GENERAL
    // ==========================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

    window.soundEvents = [];
    window.actualDuration = 0;
    window.winnerName = "";
    window.color1Name = "";
    window.color2Name = "";
    window.ringCount = 4;

    let startTime = null;
    let globalFrame = 0;
    let isFinished = false;
    let isRunning = false;
    let winner = null;

    function recordSoundHit(noteIndex, isEscape) {
      if (startTime !== null) {
        const timeSec = (performance.now() - startTime) / 1000;
        window.soundEvents.push({
          time: timeSec,
          note: noteIndex,
          isEscape: isEscape
        });
      }
    }

    // ==========================================
    // 1. PALETA DE COLORS NEÓ
    // ==========================================
    const PALETTE = [
      { name: "CYAN", color: "#00f2fe", glow: "#00f2fe" },
      { name: "PINK", color: "#ff007f", glow: "#ff007f" },
      { name: "LIME", color: "#39ff14", glow: "#39ff14" },
      { name: "GOLD", color: "#ffd700", glow: "#ffd700" },
      { name: "PURPLE", color: "#b026ff", glow: "#b026ff" },
      { name: "ORANGE", color: "#ff6600", glow: "#ff6600" },
      { name: "RED", color: "#ff2a2a", glow: "#ff2a2a" },
      { name: "BLUE", color: "#1e90ff", glow: "#1e90ff" },
      { name: "EMERALD", color: "#00ff88", glow: "#00ff88" }
    ];

    function pickTwoColors() {
      const shuffled = [...PALETTE].sort(() => Math.random() - 0.5);
      return [shuffled[0], shuffled[1]];
    }

    // ==========================================
    // 2. CONSTANTS FÍSIQUES
    // ==========================================
    const GRAVITY = 0.75;
    const BOUNCE_ACCEL = 1.012;
    const MAX_SPEED = 46;
    const BALL_RADIUS = 18;

    // Generador d'una configuració candidata
    function generateCandidateSetup() {
      const ringCount = Math.floor(Math.random() * 4) + 4; // Entre 4 i 7 anells
      const [colA, colB] = pickTwoColors();

      const baseRadius = 150;
      const spacing = ringCount <= 5 ? 70 : (ringCount === 6 ? 62 : 55);
      const rings = [];

      for (let i = 0; i < ringCount; i++) {
        const hue = (i * (360 / ringCount) + Math.random() * 40) % 360;
        rings.push({
          radius: baseRadius + i * spacing,
          gapAngle: Math.random() * Math.PI * 2,
          gapSize: 0.44, // ~25 graus
          speed: (Math.random() > 0.5 ? 1 : -1) * (0.024 + i * 0.005),
          hue: hue,
          color: `hsl(${hue}, 100%, 65%)`,
          alive: true,
          flash: 0
        });
      }

      const angle1 = Math.random() * Math.PI * 2;
      const speed1 = 28 + Math.random() * 5;
      const angle2 = (angle1 + Math.PI * 0.45 + Math.random() * Math.PI * 0.7) % (Math.PI * 2);
      const speed2 = 28 + Math.random() * 5;

      const balls = [
        {
          id: 1,
          name: colA.name,
          color: colA.color,
          glowColor: colA.glow,
          hueOffset: 0,
          x: CENTER.x - 35,
          y: CENTER.y - 40,
          vx: Math.cos(angle1) * speed1,
          vy: Math.sin(angle1) * speed1,
          radius: BALL_RADIUS,
          trail: []
        },
        {
          id: 2,
          name: colB.name,
          color: colB.color,
          glowColor: colB.glow,
          hueOffset: 180,
          x: CENTER.x + 35,
          y: CENTER.y - 40,
          vx: Math.cos(angle2) * speed2,
          vy: Math.sin(angle2) * speed2,
          radius: BALL_RADIUS,
          trail: []
        }
      ];

      return { ringCount, rings, balls };
    }

    // ==========================================
    // 3. PRE-SIMULACIÓ RÀPIDA (FINDER < 85s)
    // ==========================================
    function simulateDuration(setup, maxAllowedSec = 82) {
      // Clona l'estat per fer una prova ultraràpida en memòria
      const testRings = setup.rings.map(r => ({ ...r, alive: true }));
      const testBalls = setup.balls.map(b => ({
        x: b.x,
        y: b.y,
        vx: b.vx,
        vy: b.vy,
        radius: b.radius
      }));

      const FPS = 60;
      const SUB_STEPS = 8;
      const maxFrames = maxAllowedSec * FPS;
      let frame = 0;

      while (frame < maxFrames) {
        frame++;

        // Rotació anells
        for (let i = 0; i < testRings.length; i++) {
          if (testRings[i].alive) {
            testRings[i].gapAngle = (testRings[i].gapAngle + testRings[i].speed) % (Math.PI * 2);
          }
        }

        for (let s = 0; s < SUB_STEPS; s++) {
          for (let b = 0; b < testBalls.length; b++) {
            const ball = testBalls[b];
            ball.vy += GRAVITY / SUB_STEPS;
            ball.x += ball.vx / SUB_STEPS;
            ball.y += ball.vy / SUB_STEPS;

            const curSpeed = Math.hypot(ball.vx, ball.vy);
            if (curSpeed > MAX_SPEED) {
              ball.vx = (ball.vx / curSpeed) * MAX_SPEED;
              ball.vy = (ball.vy / curSpeed) * MAX_SPEED;
            }

            const dx = ball.x - CENTER.x;
            const dy = ball.y - CENTER.y;
            const dist = Math.hypot(dx, dy);
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);

            let hitAngle = Math.atan2(dy, dx);
            if (hitAngle < 0) hitAngle += Math.PI * 2;

            for (let r = 0; r < testRings.length; r++) {
              const ring = testRings[r];
              if (!ring.alive) continue;

              const contactDist = ring.radius;
              if (Math.abs(dist - contactDist) <= ball.radius) {
                let diff = Math.abs(hitAngle - ring.gapAngle) % (Math.PI * 2);
                if (diff > Math.PI) diff = Math.PI * 2 - diff;

                if (diff <= ring.gapSize / 2) {
                  ring.alive = false;
                  // Si s'han trencat tots, hem acabat
                  if (testRings.every(x => !x.alive)) {
                    return frame / FPS;
                  }
                } else {
                  const dot = ball.vx * nx + ball.vy * ny;
                  if (dot > 0) {
                    ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                    ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                    ball.x = CENTER.x + nx * (contactDist - ball.radius);
                    ball.y = CENTER.y + ny * (contactDist - ball.radius);
                  } else if (dot < 0) {
                    ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                    ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                    ball.x = CENTER.x + nx * (contactDist + ball.radius);
                    ball.y = CENTER.y + ny * (contactDist + ball.radius);
                  }
                }
              }
            }
          }

          // Xoc boles
          const b1 = testBalls[0], b2 = testBalls[1];
          const cdx = b2.x - b1.x, cdy = b2.y - b1.y;
          const cDist = Math.hypot(cdx, cdy);
          const minDist = b1.radius + b2.radius;
          if (cDist < minDist && cDist > 0) {
            const cnx = cdx / cDist, cny = cdy / cDist;
            const rvx = b1.vx - b2.vx, rvy = b1.vy - b2.vy;
            const velNorm = rvx * cnx + rvy * cny;
            if (velNorm > 0) {
              b1.vx -= velNorm * cnx; b1.vy -= velNorm * cny;
              b2.vx += velNorm * cnx; b2.vy += velNorm * cny;
              const sep = (minDist - cDist) / 2;
              b1.x -= cnx * sep; b1.y -= cny * sep;
              b2.x += cnx * sep; b2.y += cny * sep;
            }
          }
        }
      }

      return Infinity; // Ha superat el temps màxim permès
    }

    // Cerca un setup que duri entre 20s i 82s (sempre < 1.5 minuts)
    function findOptimalGame() {
      console.log("🔍 Pre-calculant simulació (límit màxim: 85 segons)...");
      for (let attempt = 0; attempt < 400; attempt++) {
        const candidate = generateCandidateSetup();
        const dur = simulateDuration(candidate, 82);
        if (dur >= 20 && dur <= 82) {
          console.log(`✅ Partida ideal trobada en ${attempt + 1} intents! Durada prevista: ${dur.toFixed(1)}s`);
          return candidate;
        }
      }
      return generateCandidateSetup();
    }

    // Inicialitzem el joc definitiu trobat
    const activeGame = findOptimalGame();
    let rings = activeGame.rings;
    let balls = activeGame.balls;

    window.color1Name = balls[0].name;
    window.color2Name = balls[1].name;
    window.ringCount = rings.length;

    let particles = [];

    function spawnBurst(x, y, colorStr) {
      for (let i = 0; i < 45; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 8 + Math.random() * 16;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 40,
          color: colorStr
        });
      }
    }

    function spawnWinnerConfetti(winnerColor) {
      for (let i = 0; i < 90; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 10 + Math.random() * 24;
        particles.push({
          x: CENTER.x,
          y: CENTER.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 65,
          color: i % 2 === 0 ? winnerColor : '#ffffff'
        });
      }
    }

    // ==========================================
    // 4. BUCLE DE FÍSICA EN TEMPS REAL
    // ==========================================
    function updatePhysics() {
      if (!isRunning) return;

      const SUB_STEPS = 8;
      globalFrame++;

      for (let s = 0; s < SUB_STEPS; s++) {
        balls.forEach(ball => {
          ball.vy += GRAVITY / SUB_STEPS;
          ball.x += ball.vx / SUB_STEPS;
          ball.y += ball.vy / SUB_STEPS;

          const currentSpeed = Math.hypot(ball.vx, ball.vy);
          if (currentSpeed > MAX_SPEED) {
            ball.vx = (ball.vx / currentSpeed) * MAX_SPEED;
            ball.vy = (ball.vy / currentSpeed) * MAX_SPEED;
          }

          const dx = ball.x - CENTER.x;
          const dy = ball.y - CENTER.y;
          const dist = Math.hypot(dx, dy);

          const nx = dx / (dist || 1);
          const ny = dy / (dist || 1);

          let hitAngle = Math.atan2(dy, dx);
          if (hitAngle < 0) hitAngle += Math.PI * 2;

          rings.forEach((ring, idx) => {
            if (!ring.alive) return;

            const contactDist = ring.radius;
            const isTouching = Math.abs(dist - contactDist) <= ball.radius;

            if (isTouching) {
              let diff = Math.abs(hitAngle - ring.gapAngle) % (Math.PI * 2);
              if (diff > Math.PI) diff = Math.PI * 2 - diff;

              const inGap = diff <= (ring.gapSize / 2);

              if (inGap) {
                ring.alive = false;
                recordSoundHit(idx, true);
                spawnBurst(ball.x, ball.y, ring.color);

                const remaining = rings.filter(r => r.alive).length;
                if (remaining === 0 && !isFinished) {
                  winner = ball;
                  window.winnerName = ball.name;
                  isFinished = true;

                  recordSoundHit(10, true);
                  spawnWinnerConfetti(ball.color);

                  setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                      window.actualDuration = (performance.now() - startTime) / 1000;
                      mediaRecorder.stop();
                    }
                  }, 2200);
                }
              } else {
                const dot = ball.vx * nx + ball.vy * ny;
                if (dot > 0) {
                  ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                  ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                  ball.x = CENTER.x + nx * (contactDist - ball.radius);
                  ball.y = CENTER.y + ny * (contactDist - ball.radius);
                  ring.flash = 1.0;
                  recordSoundHit(idx, false);
                } else if (dot < 0) {
                  ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                  ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                  ball.x = CENTER.x + nx * (contactDist + ball.radius);
                  ball.y = CENTER.y + ny * (contactDist + ball.radius);
                  ring.flash = 1.0;
                  recordSoundHit(idx, false);
                }
              }
            }
          });
        });

        // Xoc elàstic entre boles
        const b1 = balls[0], b2 = balls[1];
        const cdx = b2.x - b1.x, cdy = b2.y - b1.y;
        const cDist = Math.hypot(cdx, cdy);
        const minDist = b1.radius + b2.radius;

        if (cDist < minDist && cDist > 0) {
          const cnx = cdx / cDist, cny = cdy / cDist;
          const rvx = b1.vx - b2.vx, rvy = b1.vy - b2.vy;
          const velNorm = rvx * cnx + rvy * cny;

          if (velNorm > 0) {
            b1.vx -= velNorm * cnx; b1.vy -= velNorm * cny;
            b2.vx += velNorm * cnx; b2.vy += velNorm * cny;
            const sep = (minDist - cDist) / 2;
            b1.x -= cnx * sep; b1.y -= cny * sep;
            b2.x += cnx * sep; b2.y += cny * sep;
            recordSoundHit(9, false);
          }
        }
      }

      rings.forEach(r => {
        if (r.alive) {
          r.gapAngle = (r.gapAngle + r.speed) % (Math.PI * 2);
          if (r.flash > 0) r.flash -= 0.05;
        }
      });

      balls.forEach(ball => {
        const curHue = (globalFrame * 5 + ball.hueOffset) % 360;
        ball.trail.push({ x: ball.x, y: ball.y, hue: curHue });
        if (ball.trail.length > 20) ball.trail.shift();
      });
    }

    // ==========================================
    // 5. RENDERITZAT VISUAL DINÀMIC
    // ==========================================
    function render() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Anells Neó
      rings.forEach(ring => {
        if (!ring.alive) return;
        ctx.save();
        const glowSize = ring.flash > 0 ? 32 : 16;
        ctx.shadowBlur = glowSize;
        ctx.shadowColor = ring.flash > 0 ? '#ffffff' : ring.color;
        ctx.strokeStyle = ring.flash > 0 ? '#ffffff' : ring.color;
        ctx.lineWidth = ring.flash > 0 ? 13 : 9;
        ctx.lineCap = 'round';

        ctx.beginPath();
        const start = ring.gapAngle + ring.gapSize / 2;
        const end = ring.gapAngle - ring.gapSize / 2 + Math.PI * 2;
        ctx.arc(CENTER.x, CENTER.y, ring.radius, start, end);
        ctx.stroke();
        ctx.restore();
      });

      // Esteles Rainbow
      balls.forEach(ball => {
        ball.trail.forEach((pt, i) => {
          const alpha = (i + 1) / ball.trail.length;
          ctx.save();
          ctx.shadowBlur = 14;
          ctx.shadowColor = `hsl(${pt.hue}, 100%, 60%)`;
          ctx.fillStyle = `hsla(${pt.hue}, 100%, 65%, ${alpha * 0.60})`;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, ball.radius * alpha * 0.85, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      });

      // Partícules
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.life / 4), 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);

      // Pilotes amb els seus colors triats
      balls.forEach(ball => {
        ctx.save();
        ctx.shadowBlur = 25;
        ctx.shadowColor = ball.glowColor;
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Marca d'aigua
      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.textAlign = 'center';
      ctx.fillText('bouncelab.tv', CENTER.x, CENTER.y + 12);

      // Ganxo de text
      ctx.save();
      ctx.textAlign = 'center';

      if (isFinished && winner) {
        ctx.font = '900 68px sans-serif';
        ctx.fillStyle = winner.color;
        ctx.shadowBlur = 28;
        ctx.shadowColor = winner.color;
        ctx.fillText(`${winner.name} WINS! 🏆`, CENTER.x, 240);

        ctx.font = '800 36px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffffff';
        ctx.fillText('ESCAPED FIRST!', CENTER.x, 300);
      } else {
        ctx.font = '800 56px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 18;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
        ctx.fillText('WHICH ONE ESCAPES FIRST?', CENTER.x, 240);

        ctx.font = '700 32px sans-serif';
        ctx.fillStyle = balls[0].color;
        ctx.fillText(balls[0].name, CENTER.x - 110, 292);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('vs', CENTER.x, 292);
        ctx.fillStyle = balls[1].color;
        ctx.fillText(balls[1].name, CENTER.x + 110, 292);
      }
      ctx.restore();

      // Comptador d'anells restants inferior
      const remaining = rings.filter(r => r.alive).length;
      ctx.font = '700 36px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.shadowBlur = 0;
      ctx.fillText(`WALLS LEFT: ${remaining}`, CENTER.x, HEIGHT - 240);

      updatePhysics();
      requestAnimationFrame(render);
    }

    // ==========================================
    // 6. GRAVADOR SINCRONITZAT
    // ==========================================
    let mediaRecorder;
    let recordedChunks = [];

    window.startRecording = function() {
      startTime = performance.now();
      isRunning = true;
      window.soundEvents = [];
      recordedChunks = [];

      const stream = canvas.captureStream(60);

      let mimeType = 'video/webm;codecs=vp8';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      // Topall màxim de 90 segons (1.5 minuts)
      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          window.actualDuration = (performance.now() - startTime) / 1000;
          mediaRecorder.stop();
        }
      }, 90000);
    };

    render();
  </script>
</body>
</html>
