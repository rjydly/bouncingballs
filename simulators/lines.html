<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab - Lines Mode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ==========================================
    // 0. CONFIGURACIÓ GENERAL
    // ==========================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };
    const ARENA_RADIUS = 460; // Gran cercle per dibuixar la xarxa

    window.soundEvents = [];
    window.actualDuration = 0;
    window.winnerName = "";
    window.color1Name = "";
    window.color2Name = "";
    window.ringCount = 1; // En aquest mode hi ha 1 gran cercle

    let startTime = null;
    let globalFrame = 0;
    let isFinished = false;
    let isRunning = false;
    let winner = null;

    function recordSoundHit(noteIndex, isEscape) {
      if (startTime !== null) {
        const timeSec = (performance.now() - startTime) / 1000;
        window.soundEvents.push({
          time: timeSec,
          note: noteIndex,
          isEscape: isEscape
        });
      }
    }

    // ==========================================
    // 1. PALETA DE COLORS NEÓ
    // ==========================================
    const PALETTE = [
      { name: "CYAN", color: "#00f2fe", glow: "#00f2fe" },
      { name: "PINK", color: "#ff007f", glow: "#ff007f" },
      { name: "LIME", color: "#39ff14", glow: "#39ff14" },
      { name: "GOLD", color: "#ffd700", glow: "#ffd700" },
      { name: "PURPLE", color: "#b026ff", glow: "#b026ff" },
      { name: "ORANGE", color: "#ff6600", glow: "#ff6600" },
      { name: "RED", color: "#ff2a2a", glow: "#ff2a2a" },
      { name: "BLUE", color: "#1e90ff", glow: "#1e90ff" },
      { name: "EMERALD", color: "#00ff88", glow: "#00ff88" }
    ];

    function pickTwoColors() {
      const shuffled = [...PALETTE].sort(() => Math.random() - 0.5);
      return [shuffled[0], shuffled[1]];
    }

    // ==========================================
    // 2. CONSTANTS FÍSIQUES I PRE-SIMULACIÓ
    // ==========================================
    const GRAVITY = 0.72;
    const BOUNCE_ACCEL = 1.008;
    const MAX_SPEED = 46;
    const BALL_RADIUS = 18;
    const TARGET_LINES = 35; // Primera bola que arriba a 35 línies guanya!

    function generateCandidateSetup() {
      const [colA, colB] = pickTwoColors();

      const angle1 = Math.random() * Math.PI * 2;
      const speed1 = 29 + Math.random() * 5;
      const angle2 = (angle1 + Math.PI * 0.4 + Math.random() * Math.PI * 0.8) % (Math.PI * 2);
      const speed2 = 29 + Math.random() * 5;

      const balls = [
        {
          id: 1,
          name: colA.name,
          color: colA.color,
          glowColor: colA.glow,
          hueOffset: 0,
          x: CENTER.x - 40,
          y: CENTER.y - 40,
          vx: Math.cos(angle1) * speed1,
          vy: Math.sin(angle1) * speed1,
          radius: BALL_RADIUS,
          lastHit: null,
          linesCount: 0,
          trail: []
        },
        {
          id: 2,
          name: colB.name,
          color: colB.color,
          glowColor: colB.glow,
          hueOffset: 180,
          x: CENTER.x + 40,
          y: CENTER.y - 40,
          vx: Math.cos(angle2) * speed2,
          vy: Math.sin(angle2) * speed2,
          radius: BALL_RADIUS,
          lastHit: null,
          linesCount: 0,
          trail: []
        }
      ];

      return { balls };
    }

    // Pre-simulació per assegurar que la partida duri entre 20s i 65s (< 1.5 minuts)
    function simulateLinesDuration(setup, maxAllowedSec = 75) {
      const testBalls = setup.balls.map(b => ({
        x: b.x,
        y: b.y,
        vx: b.vx,
        vy: b.vy,
        radius: b.radius,
        linesCount: 0
      }));

      const FPS = 60;
      const SUB_STEPS = 8;
      const maxFrames = maxAllowedSec * FPS;
      let frame = 0;

      while (frame < maxFrames) {
        frame++;

        for (let s = 0; s < SUB_STEPS; s++) {
          for (let b = 0; b < testBalls.length; b++) {
            const ball = testBalls[b];
            ball.vy += GRAVITY / SUB_STEPS;
            ball.x += ball.vx / SUB_STEPS;
            ball.y += ball.vy / SUB_STEPS;

            const curSpeed = Math.hypot(ball.vx, ball.vy);
            if (curSpeed > MAX_SPEED) {
              ball.vx = (ball.vx / curSpeed) * MAX_SPEED;
              ball.vy = (ball.vy / curSpeed) * MAX_SPEED;
            }

            const dx = ball.x - CENTER.x;
            const dy = ball.y - CENTER.y;
            const dist = Math.hypot(dx, dy);

            if (dist >= ARENA_RADIUS - ball.radius) {
              const nx = dx / (dist || 1);
              const ny = dy / (dist || 1);
              const dot = ball.vx * nx + ball.vy * ny;

              if (dot > 0) {
                ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                ball.x = CENTER.x + nx * (ARENA_RADIUS - ball.radius);
                ball.y = CENTER.y + ny * (ARENA_RADIUS - ball.radius);

                ball.linesCount++;
                if (ball.linesCount >= TARGET_LINES) {
                  return frame / FPS; // Tenim guanyador!
                }
              }
            }
          }

          // Xoc entre boles
          const b1 = testBalls[0], b2 = testBalls[1];
          const cdx = b2.x - b1.x, cdy = b2.y - b1.y;
          const cDist = Math.hypot(cdx, cdy);
          const minDist = b1.radius + b2.radius;
          if (cDist < minDist && cDist > 0) {
            const cnx = cdx / cDist, cny = cdy / cDist;
            const rvx = b1.vx - b2.vx, rvy = b1.vy - b2.vy;
            const velNorm = rvx * cnx + rvy * cny;
            if (velNorm > 0) {
              b1.vx -= velNorm * cnx; b1.vy -= velNorm * cny;
              b2.vx += velNorm * cnx; b2.vy += velNorm * cny;
              const sep = (minDist - cDist) / 2;
              b1.x -= cnx * sep; b1.y -= cny * sep;
              b2.x += cnx * sep; b2.y += cny * sep;
            }
          }
        }
      }

      return Infinity;
    }

    function findOptimalGame() {
      console.log("🔍 Pre-calculant mode LÍNIES (límit < 65s)...");
      for (let attempt = 0; attempt < 300; attempt++) {
        const candidate = generateCandidateSetup();
        const dur = simulateLinesDuration(candidate, 65);
        if (dur >= 20 && dur <= 60) {
          console.log(`✅ Partida de línies trobada en ${attempt + 1} intents! Durada prevista: ${dur.toFixed(1)}s`);
          return candidate;
        }
      }
      return generateCandidateSetup();
    }

    const activeGame = findOptimalGame();
    let balls = activeGame.balls;

    window.color1Name = balls[0].name;
    window.color2Name = balls[1].name;

    // Array que emmagatzema les cordes geomètriques dibuixades
    let drawnLines = [];
    let particles = [];
    let arenaFlash = 0;

    function spawnBurst(x, y, colorStr) {
      for (let i = 0; i < 40; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 7 + Math.random() * 15;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 35,
          color: colorStr
        });
      }
    }

    function spawnWinnerConfetti(winnerColor) {
      for (let i = 0; i < 90; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 10 + Math.random() * 24;
        particles.push({
          x: CENTER.x,
          y: CENTER.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 65,
          color: i % 2 === 0 ? winnerColor : '#ffffff'
        });
      }
    }

    // ==========================================
    // 3. FÍSICA I GENERACIÓ DE LA XARXA
    // ==========================================
    function updatePhysics() {
      if (!isRunning) return;

      const SUB_STEPS = 8;
      globalFrame++;

      for (let s = 0; s < SUB_STEPS; s++) {
        balls.forEach((ball, bIdx) => {
          ball.vy += GRAVITY / SUB_STEPS;
          ball.x += ball.vx / SUB_STEPS;
          ball.y += ball.vy / SUB_STEPS;

          const currentSpeed = Math.hypot(ball.vx, ball.vy);
          if (currentSpeed > MAX_SPEED) {
            ball.vx = (ball.vx / currentSpeed) * MAX_SPEED;
            ball.vy = (ball.vy / currentSpeed) * MAX_SPEED;
          }

          const dx = ball.x - CENTER.x;
          const dy = ball.y - CENTER.y;
          const dist = Math.hypot(dx, dy);

          // Xoc contra la paret circular exterior
          if (dist >= ARENA_RADIUS - ball.radius) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            const dot = ball.vx * nx + ball.vy * ny;

            if (dot > 0) {
              // Rebot elàstic
              ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
              ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
              ball.x = CENTER.x + nx * (ARENA_RADIUS - ball.radius);
              ball.y = CENTER.y + ny * (ARENA_RADIUS - ball.radius);

              const hitPoint = { x: ball.x, y: ball.y };

              // Si ja tenia un punt d'impacte anterior, tracem la corda laser!
              if (ball.lastHit) {
                drawnLines.push({
                  x1: ball.lastHit.x,
                  y1: ball.lastHit.y,
                  x2: hitPoint.x,
                  y2: hitPoint.y,
                  color: ball.color,
                  glow: ball.glowColor,
                  createdFrame: globalFrame
                });

                ball.linesCount++;

                // Efecte mem cada 10 línies
                const isMilestone = (ball.linesCount % 10 === 0);
                recordSoundHit(ball.linesCount, isMilestone);

                // COMPROVACIÓ DE GUANYADOR
                if (ball.linesCount >= TARGET_LINES && !isFinished) {
                  winner = ball;
                  window.winnerName = ball.name;
                  isFinished = true;
                  arenaFlash = 1.0;

                  recordSoundHit(10, true);
                  spawnWinnerConfetti(ball.color);

                  setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                      window.actualDuration = (performance.now() - startTime) / 1000;
                      mediaRecorder.stop();
                    }
                  }, 2200);
                }
              } else {
                recordSoundHit(1, false);
              }

              ball.lastHit = hitPoint;
              spawnBurst(ball.x, ball.y, ball.color);
            }
          }
        });

        // Xoc elàstic entre boles
        const b1 = balls[0], b2 = balls[1];
        const cdx = b2.x - b1.x, cdy = b2.y - b1.y;
        const cDist = Math.hypot(cdx, cdy);
        const minDist = b1.radius + b2.radius;

        if (cDist < minDist && cDist > 0) {
          const cnx = cdx / cDist, cny = cdy / cDist;
          const rvx = b1.vx - b2.vx, rvy = b1.vy - b2.vy;
          const velNorm = rvx * cnx + rvy * cny;

          if (velNorm > 0) {
            b1.vx -= velNorm * cnx; b1.vy -= velNorm * cny;
            b2.vx += velNorm * cnx; b2.vy += velNorm * cny;
            const sep = (minDist - cDist) / 2;
            b1.x -= cnx * sep; b1.y -= cny * sep;
            b2.x += cnx * sep; b2.y += cny * sep;
            recordSoundHit(9, false);
          }
        }
      }

      if (arenaFlash > 0) arenaFlash -= 0.04;

      balls.forEach(ball => {
        const curHue = (globalFrame * 5 + ball.hueOffset) % 360;
        ball.trail.push({ x: ball.x, y: ball.y, hue: curHue });
        if (ball.trail.length > 20) ball.trail.shift();
      });
    }

    // ==========================================
    // 4. RENDERITZAT VISUAL DE LA XARXA MANDALA
    // ==========================================
    function render() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // 1. Dibuixar la xarxa de línies geomètriques acumulades (String Art)
      drawnLines.forEach(line => {
        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = line.glow;
        ctx.strokeStyle = line.color;
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.55;

        ctx.beginPath();
        ctx.moveTo(line.x1, line.y1);
        ctx.lineTo(line.x2, line.y2);
        ctx.stroke();
        ctx.restore();
      });

      // 2. Dibuixar el cercle exterior
      ctx.save();
      const glowAmt = arenaFlash > 0 ? 35 : 18;
      ctx.shadowBlur = glowAmt;
      ctx.shadowColor = arenaFlash > 0 ? '#ffffff' : '#4f46e5';
      ctx.strokeStyle = arenaFlash > 0 ? '#ffffff' : '#6366f1';
      ctx.lineWidth = arenaFlash > 0 ? 14 : 10;
      ctx.beginPath();
      ctx.arc(CENTER.x, CENTER.y, ARENA_RADIUS, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 3. Esteles Rainbow de les pilotes
      balls.forEach(ball => {
        ball.trail.forEach((pt, i) => {
          const alpha = (i + 1) / ball.trail.length;
          ctx.save();
          ctx.shadowBlur = 14;
          ctx.shadowColor = `hsl(${pt.hue}, 100%, 60%)`;
          ctx.fillStyle = `hsla(${pt.hue}, 100%, 65%, ${alpha * 0.60})`;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, ball.radius * alpha * 0.85, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      });

      // 4. Partícules
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.life / 4), 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);

      // 5. Pilotes
      balls.forEach(ball => {
        ctx.save();
        ctx.shadowBlur = 25;
        ctx.shadowColor = ball.glowColor;
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Marca d'aigua
      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.textAlign = 'center';
      ctx.fillText('bouncelab.tv', CENTER.x, CENTER.y + 12);

      // 6. Textos i Marcador en temps real
      ctx.save();
      ctx.textAlign = 'center';

      if (isFinished && winner) {
        ctx.font = '900 68px sans-serif';
        ctx.fillStyle = winner.color;
        ctx.shadowBlur = 28;
        ctx.shadowColor = winner.color;
        ctx.fillText(`${winner.name} WINS! 🏆`, CENTER.x, 240);

        ctx.font = '800 36px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffffff';
        ctx.fillText('FIRST TO 35 LINES!', CENTER.x, 300);
      } else {
        ctx.font = '800 56px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 18;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
        ctx.fillText('FIRST TO 35 LINES!', CENTER.x, 230);

        // Marcador viu de punts
        ctx.font = '700 34px sans-serif';
        ctx.fillStyle = balls[0].color;
        ctx.fillText(`${balls[0].name}: ${balls[0].linesCount}/${TARGET_LINES}`, CENTER.x - 180, 290);

        ctx.fillStyle = '#ffffff';
        ctx.fillText('vs', CENTER.x, 290);

        ctx.fillStyle = balls[1].color;
        ctx.fillText(`${balls[1].name}: ${balls[1].linesCount}/${TARGET_LINES}`, CENTER.x + 180, 290);
      }
      ctx.restore();

      // Indicador inferior de total de cordes creades
      ctx.font = '700 32px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.textAlign = 'center';
      ctx.fillText(`TOTAL CHORDS DRAWN: ${drawnLines.length}`, CENTER.x, HEIGHT - 240);

      updatePhysics();
      requestAnimationFrame(render);
    }

    // ==========================================
    // 5. GRAVADOR SINCRONITZAT
    // ==========================================
    let mediaRecorder;
    let recordedChunks = [];

    window.startRecording = function() {
      startTime = performance.now();
      isRunning = true;
      window.soundEvents = [];
      recordedChunks = [];

      const stream = canvas.captureStream(60);

      let mimeType = 'video/webm;codecs=vp8';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          window.actualDuration = (performance.now() - startTime) / 1000;
          mediaRecorder.stop();
        }
      }, 90000);
    };

    render();
  </script>
</body>
</html>
