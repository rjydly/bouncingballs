<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab - String Battle Royale</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ==========================================
    // 0. CONFIGURACIÓ GENERAL
    // ==========================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };
    const ARENA_RADIUS = 465;

    window.soundEvents = [];
    window.actualDuration = 0;
    window.winnerName = "";
    window.color1Name = "";
    window.color2Name = "";
    window.ringCount = 1;

    let startTime = null;
    let globalFrame = 0;
    let isFinished = false;
    let isRunning = false;
    let winner = null;

    function recordSoundHit(noteIndex, isEscape) {
      if (startTime !== null) {
        const timeSec = (performance.now() - startTime) / 1000;
        window.soundEvents.push({
          time: timeSec,
          note: noteIndex,
          isEscape: isEscape // isEscape = true activa el so mem d'assets/audio/
        });
      }
    }

    // ==========================================
    // 1. PALETA DE COLORS NEÓ
    // ==========================================
    const PALETTE = [
      { name: "CYAN", color: "#00f2fe", glow: "#00f2fe" },
      { name: "PINK", color: "#ff007f", glow: "#ff007f" },
      { name: "LIME", color: "#39ff14", glow: "#39ff14" },
      { name: "GOLD", color: "#ffd700", glow: "#ffd700" },
      { name: "PURPLE", color: "#b026ff", glow: "#b026ff" },
      { name: "ORANGE", color: "#ff6600", glow: "#ff6600" },
      { name: "RED", color: "#ff2a2a", glow: "#ff2a2a" },
      { name: "BLUE", color: "#1e90ff", glow: "#1e90ff" },
      { name: "EMERALD", color: "#00ff88", glow: "#00ff88" }
    ];

    // ==========================================
    // 2. GENERADOR DE BATALLA (4 A 7 BOLES)
    // ==========================================
    const GRAVITY = 0.50; // Física viva
    const BOUNCE_ACCEL = 1.005;
    const MAX_SPEED = 42;
    const BALL_RADIUS = 20;

    function distPointToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function generateBattleCandidate() {
      const numBalls = Math.floor(Math.random() * 4) + 4; // 4, 5, 6 o 7 boles
      const shuffledColors = [...PALETTE].sort(() => Math.random() - 0.5).slice(0, numBalls);

      const TOTAL_ANCHORS = 110; // Punts totals al voltant del cercle
      const anchorsPerBall = Math.floor(TOTAL_ANCHORS / numBalls);

      let balls = [];

      for (let i = 0; i < numBalls; i++) {
        const col = shuffledColors[i];
        const midAngle = (i + 0.5) * (2 * Math.PI / numBalls);

        // Posició inicial separada cap al seu sector
        const spawnDist = 180 + Math.random() * 80;
        const bx = CENTER.x + Math.cos(midAngle) * spawnDist;
        const by = CENTER.y + Math.sin(midAngle) * spawnDist;

        // Velocitat llançada cap al centre amb desviació
        const moveAngle = midAngle + Math.PI + (Math.random() - 0.5) * 1.2;
        const spd = 26 + Math.random() * 6;

        // Generar les línies connectades a la paret per a aquesta bola
        const lines = [];
        for (let a = 0; a < anchorsPerBall; a++) {
          const anchorIdx = i * anchorsPerBall + a;
          const theta = (anchorIdx / TOTAL_ANCHORS) * (2 * Math.PI);
          lines.push({
            ax: CENTER.x + Math.cos(theta) * ARENA_RADIUS,
            ay: CENTER.y + Math.sin(theta) * ARENA_RADIUS
          });
        }

        balls.push({
          id: i + 1,
          name: col.name,
          color: col.color,
          glowColor: col.glow,
          x: bx,
          y: by,
          vx: Math.cos(moveAngle) * spd,
          vy: Math.sin(moveAngle) * spd,
          radius: BALL_RADIUS,
          lines: lines,
          alive: true,
          trail: []
        });
      }

      return { balls };
    }

    // Pre-simulació ultra-ràpida per assegurar que la batalla duri entre 25s i 78s
    function simulateBattle(setup, maxAllowedSec = 82) {
      const testBalls = setup.balls.map(b => ({
        x: b.x,
        y: b.y,
        vx: b.vx,
        vy: b.vy,
        radius: b.radius,
        alive: true,
        lines: b.lines.map(l => ({ ax: l.ax, ay: l.ay }))
      }));

      const FPS = 60;
      const SUB_STEPS = 6;
      const maxFrames = maxAllowedSec * FPS;
      let frame = 0;

      while (frame < maxFrames) {
        frame++;

        for (let s = 0; s < SUB_STEPS; s++) {
          // 1. Moure boles
          for (let b = 0; b < testBalls.length; b++) {
            const ball = testBalls[b];
            if (!ball.alive) continue;

            ball.vy += GRAVITY / SUB_STEPS;
            ball.x += ball.vx / SUB_STEPS;
            ball.y += ball.vy / SUB_STEPS;

            const curSpeed = Math.hypot(ball.vx, ball.vy);
            if (curSpeed > MAX_SPEED) {
              ball.vx = (ball.vx / curSpeed) * MAX_SPEED;
              ball.vy = (ball.vy / curSpeed) * MAX_SPEED;
            }

            const dx = ball.x - CENTER.x;
            const dy = ball.y - CENTER.y;
            const dist = Math.hypot(dx, dy);

            // Rebot i creació de nova línia
            if (dist >= ARENA_RADIUS - ball.radius) {
              const nx = dx / (dist || 1);
              const ny = dy / (dist || 1);
              const dot = ball.vx * nx + ball.vy * ny;

              if (dot > 0) {
                ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                ball.x = CENTER.x + nx * (ARENA_RADIUS - ball.radius);
                ball.y = CENTER.y + ny * (ARENA_RADIUS - ball.radius);

                // Nova línia ancorada al xoc
                ball.lines.push({
                  ax: CENTER.x + nx * ARENA_RADIUS,
                  ay: CENTER.y + ny * ARENA_RADIUS
                });
              }
            }
          }

          // 2. Tallar línies dels rivals
          for (let b = 0; b < testBalls.length; b++) {
            const cutter = testBalls[b];
            if (!cutter.alive) continue;

            for (let t = 0; t < testBalls.length; t++) {
              if (b === t) continue;
              const target = testBalls[t];
              if (!target.alive) continue;

              for (let l = target.lines.length - 1; l >= 0; l--) {
                const line = target.lines[l];
                const d = distPointToSegment(cutter.x, cutter.y, line.ax, line.ay, target.x, target.y);
                if (d <= cutter.radius + 3) {
                  target.lines.splice(l, 1);
                  if (target.lines.length === 0) {
                    target.alive = false; // BOLA ELIMINADA!
                  }
                }
              }
            }
          }

          // Comprovar si només en queda 1 viva
          const aliveRemaining = testBalls.filter(x => x.alive).length;
          if (aliveRemaining <= 1) {
            return frame / FPS;
          }
        }
      }

      return Infinity;
    }

    function findPerfectBattle() {
      console.log("🔍 Pre-calculant batalla (cercant duel d'entre 25s i 75s)...");
      for (let attempt = 0; attempt < 350; attempt++) {
        const candidate = generateBattleCandidate();
        const dur = simulateBattle(candidate, 78);
        if (dur >= 24 && dur <= 75) {
          console.log(`✅ Batalla perfecta trobada en intent ${attempt + 1}! Durada: ${dur.toFixed(1)}s`);
          return candidate;
        }
      }
      return generateBattleCandidate();
    }

    const activeBattle = findPerfectBattle();
    let balls = activeBattle.balls;

    window.color1Name = balls[0].name;
    window.color2Name = balls[1].name;
    window.ringCount = balls.length;

    let particles = [];
    let cutSparks = [];

    function spawnDeathBurst(x, y, colorStr) {
      for (let i = 0; i < 60; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 8 + Math.random() * 20;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 45,
          color: colorStr
        });
      }
    }

    function spawnWinnerConfetti(winnerColor) {
      for (let i = 0; i < 110; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 10 + Math.random() * 26;
        particles.push({
          x: CENTER.x,
          y: CENTER.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 70,
          color: i % 2 === 0 ? winnerColor : '#ffffff'
        });
      }
    }

    // ==========================================
    // 3. FÍSICA EN TEMPS REAL
    // ==========================================
    function updatePhysics() {
      if (!isRunning) return;

      const SUB_STEPS = 6;
      globalFrame++;

      for (let s = 0; s < SUB_STEPS; s++) {
        // 1. Moure boles vives
        balls.forEach(ball => {
          if (!ball.alive) return;

          ball.vy += GRAVITY / SUB_STEPS;
          ball.x += ball.vx / SUB_STEPS;
          ball.y += ball.vy / SUB_STEPS;

          const currentSpeed = Math.hypot(ball.vx, ball.vy);
          if (currentSpeed > MAX_SPEED) {
            ball.vx = (ball.vx / currentSpeed) * MAX_SPEED;
            ball.vy = (ball.vy / currentSpeed) * MAX_SPEED;
          }

          const dx = ball.x - CENTER.x;
          const dy = ball.y - CENTER.y;
          const dist = Math.hypot(dx, dy);

          // Rebot a la paret i creació de nova línia
          if (dist >= ARENA_RADIUS - ball.radius) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            const dot = ball.vx * nx + ball.vy * ny;

            if (dot > 0) {
              ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
              ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
              ball.x = CENTER.x + nx * (ARENA_RADIUS - ball.radius);
              ball.y = CENTER.y + ny * (ARENA_RADIUS - ball.radius);

              // Nova corda ancorada a la paret
              ball.lines.push({
                ax: CENTER.x + nx * ARENA_RADIUS,
                ay: CENTER.y + ny * ARENA_RADIUS
              });

              recordSoundHit(ball.id, false);
            }
          }
        });

        // 2. Col·lisió entre boles
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i], b2 = balls[j];
            if (!b1.alive || !b2.alive) continue;

            const cdx = b2.x - b1.x, cdy = b2.y - b1.y;
            const cDist = Math.hypot(cdx, cdy);
            const minDist = b1.radius + b2.radius;

            if (cDist < minDist && cDist > 0) {
              const cnx = cdx / cDist, cny = cdy / cDist;
              const rvx = b1.vx - b2.vx, rvy = b1.vy - b2.vy;
              const velNorm = rvx * cnx + rvy * cny;

              if (velNorm > 0) {
                b1.vx -= velNorm * cnx; b1.vy -= velNorm * cny;
                b2.vx += velNorm * cnx; b2.vy += velNorm * cny;
                const sep = (minDist - cDist) / 2;
                b1.x -= cnx * sep; b1.y -= cny * sep;
                b2.x += cnx * sep; b2.y += cny * sep;
              }
            }
          }
        }

        // 3. TALLAR LÍNIES DE RIVALS
        balls.forEach(cutter => {
          if (!cutter.alive) return;

          balls.forEach(target => {
            if (!target.alive || target.id === cutter.id) return;

            for (let l = target.lines.length - 1; l >= 0; l--) {
              const line = target.lines[l];
              const d = distPointToSegment(cutter.x, cutter.y, line.ax, line.ay, target.x, target.y);

              if (d <= cutter.radius + 3) {
                // CORDA TALLADA!
                target.lines.splice(l, 1);

                // Guspires al punt del tall
                cutSparks.push({ x: cutter.x, y: cutter.y, life: 12, color: target.color });

                // BOLA ELIMINADA SI ES QUEDA A 0 LÍNIES!
                if (target.lines.length === 0) {
                  target.alive = false;
                  spawnDeathBurst(target.x, target.y, target.color);

                  // DISPARAR EL SO MEM SELECCIONAT A LA MORT!
                  recordSoundHit(10, true);

                  // Comprovar si només en queda 1 de viva (GUANYADOR)
                  const aliveList = balls.filter(b => b.alive);
                  if (aliveList.length === 1 && !isFinished) {
                    winner = aliveList[0];
                    window.winnerName = winner.name;
                    isFinished = true;

                    spawnWinnerConfetti(winner.color);

                    setTimeout(() => {
                      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        window.actualDuration = (performance.now() - startTime) / 1000;
                        mediaRecorder.stop();
                      }
                    }, 2400);
                  }
                }
              }
            }
          });
        });
      }

      // Esteles
      balls.forEach(ball => {
        if (!ball.alive) return;
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 14) ball.trail.shift();
      });
    }

    // ==========================================
    // 4. RENDERITZAT VISUAL DE LA BATALLA
    // ==========================================
    function render() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // 1. Dibuixar totes les cordes vives lligades a cada bola
      balls.forEach(ball => {
        if (!ball.alive) return;

        ctx.save();
        ctx.strokeStyle = ball.color;
        ctx.lineWidth = 2.2;
        ctx.globalAlpha = 0.65;
        ctx.shadowBlur = 6;
        ctx.shadowColor = ball.glowColor;

        ball.lines.forEach(line => {
          ctx.beginPath();
          ctx.moveTo(line.ax, line.ay);
          ctx.lineTo(ball.x, ball.y);
          ctx.stroke();
        });
        ctx.restore();
      });

      // 2. Anell del perímetre exterior
      ctx.save();
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#6366f1';
      ctx.strokeStyle = '#818cf8';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(CENTER.x, CENTER.y, ARENA_RADIUS, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 3. Guspires de talls
      cutSparks.forEach(s => {
        s.life--;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.life / 2, 0, Math.PI * 2);
        ctx.fill();
      });
      cutSparks = cutSparks.filter(s => s.life > 0);

      // 4. Partícules de mort i confeti
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.life / 4), 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);

      // 5. Dibuixar boles vives
      balls.forEach(ball => {
        if (!ball.alive) return;

        // Estela
        ball.trail.forEach((pt, i) => {
          const alpha = (i + 1) / ball.trail.length;
          ctx.fillStyle = ball.color;
          ctx.globalAlpha = alpha * 0.3;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, ball.radius * alpha * 0.7, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // Bola amb brillantor
        ctx.save();
        ctx.shadowBlur = 24;
        ctx.shadowColor = ball.glowColor;
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Marca d'aigua
      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.textAlign = 'center';
      ctx.fillText('bouncelab.tv', CENTER.x, CENTER.y + 12);

      // 6. Marcador i textos superiors
      ctx.save();
      ctx.textAlign = 'center';

      if (isFinished && winner) {
        ctx.font = '900 68px sans-serif';
        ctx.fillStyle = winner.color;
        ctx.shadowBlur = 28;
        ctx.shadowColor = winner.color;
        ctx.fillText(`${winner.name} WINS! 🏆`, CENTER.x, 240);

        ctx.font = '800 36px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffffff';
        ctx.fillText('LAST BALL STANDING!', CENTER.x, 300);
      } else {
        ctx.font = '800 56px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 18;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
        ctx.fillText('LAST ONE STANDING! ⚔️', CENTER.x, 230);

        // Marcador viu de cordes de cada color
        const totalAlive = balls.filter(b => b.alive).length;
        ctx.font = '700 30px sans-serif';

        const spacingX = Math.min(130, (WIDTH - 120) / balls.length);
        const startX = CENTER.x - ((balls.length - 1) * spacingX) / 2;

        balls.forEach((b, idx) => {
          const posX = startX + idx * spacingX;
          if (b.alive) {
            ctx.fillStyle = b.color;
            ctx.fillText(`${b.lines.length}`, posX, 290);
          } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.fillText('💀', posX, 290);
          }
        });
      }
      ctx.restore();

      // Indicador de boles vives inferior
      const remainingAlive = balls.filter(b => b.alive).length;
      ctx.font = '700 34px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.textAlign = 'center';
      ctx.fillText(`ALIVE: ${remainingAlive} / ${balls.length}`, CENTER.x, HEIGHT - 230);

      updatePhysics();
      requestAnimationFrame(render);
    }

    // ==========================================
    // 5. GRAVADOR SINCRONITZAT AL SEGON 0
    // ==========================================
    let mediaRecorder;
    let recordedChunks = [];

    window.startRecording = function() {
      startTime = performance.now();
      isRunning = true;
      window.soundEvents = [];
      recordedChunks = [];

      const stream = canvas.captureStream(60);

      let mimeType = 'video/webm;codecs=vp8';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          window.actualDuration = (performance.now() - startTime) / 1000;
          mediaRecorder.stop();
        }
      }, 90000);
    };

    render();
  </script>
</body>
</html>
