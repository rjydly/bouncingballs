<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab - String Battle Royale</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ==========================================
    // 0. CONFIGURACIÓ GENERAL
    // ==========================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };
    const ARENA_RADIUS = 465;

    // LÍMITS DE DURADA GARANTITS: Entre 20s i 75s
    const STRICT_MIN_DURATION = 20.0;
    const STRICT_MAX_DURATION = 75.0;

    window.soundEvents = [];
    window.actualDuration = 0;
    window.winnerName = "";
    window.color1Name = "";
    window.color2Name = "";
    window.ringCount = 1;

    let startTime = null;
    let globalFrame = 0;
    let isFinished = false;
    let isRunning = false;
    let winner = null;

    function recordSoundHit(noteIndex, isEscape) {
      if (startTime !== null) {
        const timeSec = (performance.now() - startTime) / 1000;
        window.soundEvents.push({
          time: timeSec,
          note: noteIndex,
          isEscape: isEscape
        });
      }
    }

    // ==========================================
    // 1. PALETA DE COLORS NEÓ
    // ==========================================
    const PALETTE = [
      { name: "CYAN", color: "#00f2fe", glow: "#00f2fe" },
      { name: "PINK", color: "#ff007f", glow: "#ff007f" },
      { name: "LIME", color: "#39ff14", glow: "#39ff14" },
      { name: "GOLD", color: "#ffd700", glow: "#ffd700" },
      { name: "PURPLE", color: "#b026ff", glow: "#b026ff" },
      { name: "ORANGE", color: "#ff6600", glow: "#ff6600" },
      { name: "RED", color: "#ff2a2a", glow: "#ff2a2a" },
      { name: "BLUE", color: "#1e90ff", glow: "#1e90ff" },
      { name: "EMERALD", color: "#00ff88", glow: "#00ff88" }
    ];

    // ==========================================
    // 2. FÍSICA EQUILIBRADA
    // ==========================================
    const GRAVITY = 0.0;
    const INITIAL_SPEED = 9.0;
    const MIN_SPEED = 8.0;
    const INDIVIDUAL_BOUNCE_ACCEL = 1.025;
    const MAX_SPEED = 42;
    const BALL_RADIUS = 20;
    const CUTTER_COOLDOWN = 10;
    const MAX_LINES_PER_BALL = 28; // Evita acumulació infinita de cordes

    function distToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function generateBattleCandidate() {
      // 4 o 5 boles
      const numBalls = Math.random() < 0.5 ? 4 : 5;
      const shuffledColors = [...PALETTE].sort(() => Math.random() - 0.5).slice(0, numBalls);

      const TOTAL_ANCHORS = 110;
      const anchorsPerBall = Math.floor(TOTAL_ANCHORS / numBalls);

      let balls = [];

      for (let i = 0; i < numBalls; i++) {
        const col = shuffledColors[i];
        const midAngle = (i + 0.5) * (2 * Math.PI / numBalls);

        const spawnDist = 180 + Math.random() * 80;
        const bx = CENTER.x + Math.cos(midAngle) * spawnDist;
        const by = CENTER.y + Math.sin(midAngle) * spawnDist;

        const moveAngle = Math.random() * Math.PI * 2;

        const lines = [];
        for (let a = 0; a < anchorsPerBall; a++) {
          const anchorIdx = i * anchorsPerBall + a;
          const theta = (anchorIdx / TOTAL_ANCHORS) * (2 * Math.PI);
          lines.push({
            ax: CENTER.x + Math.cos(theta) * ARENA_RADIUS,
            ay: CENTER.y + Math.sin(theta) * ARENA_RADIUS
          });
        }

        balls.push({
          id: i + 1,
          name: col.name,
          color: col.color,
          glowColor: col.glow,
          x: bx,
          y: by,
          vx: Math.cos(moveAngle) * INITIAL_SPEED,
          vy: Math.sin(moveAngle) * INITIAL_SPEED,
          radius: BALL_RADIUS,
          lines: lines,
          alive: true,
          cutCooldownTimer: 0,
          trail: []
        });
      }

      return { balls };
    }

    // ==========================================
    // 3. PRE-SIMULACIÓ (20s - 75s)
    // ==========================================
    function simulateBattle(setup, maxAllowedSec) {
      const testBalls = setup.balls.map(b => ({
        x: b.x,
        y: b.y,
        vx: b.vx,
        vy: b.vy,
        radius: b.radius,
        alive: true,
        cutCooldownTimer: 0,
        lines: b.lines.map(l => ({ ax: l.ax, ay: l.ay }))
      }));

      const FPS = 60;
      const SUB_STEPS = 6;
      const maxFrames = maxAllowedSec * FPS;
      let frame = 0;

      while (frame < maxFrames) {
        frame++;

        for (let b = 0; b < testBalls.length; b++) {
          if (testBalls[b].cutCooldownTimer > 0) testBalls[b].cutCooldownTimer--;
        }

        for (let s = 0; s < SUB_STEPS; s++) {
          // 1. Moure boles vives
          for (let b = 0; b < testBalls.length; b++) {
            const ball = testBalls[b];
            if (!ball.alive) continue;

            ball.x += ball.vx / SUB_STEPS;
            ball.y += ball.vy / SUB_STEPS;

            const dx = ball.x - CENTER.x;
            const dy = ball.y - CENTER.y;
            const dist = Math.hypot(dx, dy);

            // Rebot de paret: afegeix 1 sola corda (fins a un màxim de 28)
            if (dist >= ARENA_RADIUS - ball.radius) {
              const nx = dx / (dist || 1);
              const ny = dy / (dist || 1);
              const dot = ball.vx * nx + ball.vy * ny;

              if (dot > 0) {
                let rx = (ball.vx - 2 * dot * nx) * INDIVIDUAL_BOUNCE_ACCEL;
                let ry = (ball.vy - 2 * dot * ny) * INDIVIDUAL_BOUNCE_ACCEL;

                const ang = Math.atan2(ry, rx) + (Math.random() - 0.5) * 0.10;
                const spd = Math.min(MAX_SPEED, Math.max(MIN_SPEED, Math.hypot(rx, ry)));
                ball.vx = Math.cos(ang) * spd;
                ball.vy = Math.sin(ang) * spd;

                ball.x = CENTER.x + nx * (ARENA_RADIUS - ball.radius);
                ball.y = CENTER.y + ny * (ARENA_RADIUS - ball.radius);

                if (ball.lines.length < MAX_LINES_PER_BALL) {
                  ball.lines.push({
                    ax: CENTER.x + nx * ARENA_RADIUS,
                    ay: CENTER.y + ny * ARENA_RADIUS
                  });
                }
              }
            }
          }

          // 2. Rebot elàstic entre boles
          for (let i = 0; i < testBalls.length; i++) {
            for (let j = i + 1; j < testBalls.length; j++) {
              const b1 = testBalls[i], b2 = testBalls[j];
              if (!b1.alive || !b2.alive) continue;

              const cdx = b2.x - b1.x;
              const cdy = b2.y - b1.y;
              const cDist = Math.hypot(cdx, cdy);
              const minDist = b1.radius + b2.radius;

              if (cDist < minDist && cDist > 0) {
                const cnx = cdx / cDist;
                const cny = cdy / cDist;

                const overlap = minDist - cDist;
                b1.x -= cnx * (overlap * 0.5);
                b1.y -= cny * (overlap * 0.5);
                b2.x += cnx * (overlap * 0.5);
                b2.y += cny * (overlap * 0.5);

                const rvx = b1.vx - b2.vx;
                const rvy = b1.vy - b2.vy;
                const velAlongNorm = rvx * cnx + rvy * cny;

                if (velAlongNorm > 0) {
                  b1.vx -= velAlongNorm * cnx;
                  b1.vy -= velAlongNorm * cny;
                  b2.vx += velAlongNorm * cnx;
                  b2.vy += velAlongNorm * cny;
                }
              }
            }
          }

          // 3. Tall físic de cordes
          for (let b = 0; b < testBalls.length; b++) {
            const cutter = testBalls[b];
            if (!cutter.alive || cutter.cutCooldownTimer > 0) continue;

            for (let t = 0; t < testBalls.length; t++) {
              if (b === t) continue;
              const target = testBalls[t];
              if (!target.alive) continue;

              for (let l = target.lines.length - 1; l >= 0; l--) {
                const line = target.lines[l];
                const d = distToSegment(cutter.x, cutter.y, line.ax, line.ay, target.x, target.y);

                if (d <= cutter.radius + 1.5) {
                  target.lines.splice(l, 1);
                  cutter.cutCooldownTimer = CUTTER_COOLDOWN;

                  if (target.lines.length === 0) {
                    target.alive = false;
                  }
                  break;
                }
              }
              if (cutter.cutCooldownTimer > 0) break;
            }
          }

          const aliveRemaining = testBalls.filter(x => x.alive).length;
          if (aliveRemaining <= 1) {
            return frame / FPS;
          }
        }
      }

      return Infinity;
    }

    function findPerfectBattle() {
      console.log(`🔍 Cercant partida entre ${STRICT_MIN_DURATION}s i ${STRICT_MAX_DURATION}s...`);
      for (let attempt = 0; attempt < 800; attempt++) {
        const candidate = generateBattleCandidate();
        const dur = simulateBattle(candidate, STRICT_MAX_DURATION);

        if (dur >= STRICT_MIN_DURATION && dur <= STRICT_MAX_DURATION) {
          console.log(`✅ PARTIDA CONFIRMADA en intent ${attempt + 1}! Durada: ${dur.toFixed(1)}s`);
          return candidate;
        }
      }

      return generateBattleCandidate();
    }

    const activeBattle = findPerfectBattle();
    let balls = activeBattle.balls;

    window.color1Name = balls[0].name;
    window.color2Name = balls[1].name;
    window.ringCount = balls.length;

    let particles = [];
    let cutSparks = [];

    function spawnDeathBurst(x, y, colorStr) {
      for (let i = 0; i < 40; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 7 + Math.random() * 16;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 35,
          color: colorStr
        });
      }
    }

    function spawnWinnerConfetti(winnerColor) {
      for (let i = 0; i < 90; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 9 + Math.random() * 22;
        particles.push({
          x: CENTER.x,
          y: CENTER.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 65,
          color: i % 2 === 0 ? winnerColor : '#ffffff'
        });
      }
    }

    // ==========================================
    // 4. BUCLE DE FÍSICA EN TEMPS REAL
    // ==========================================
    function updatePhysics() {
      if (!isRunning) return;

      const SUB_STEPS = 6;
      globalFrame++;

      balls.forEach(b => {
        if (b.cutCooldownTimer > 0) b.cutCooldownTimer--;
      });

      for (let s = 0; s < SUB_STEPS; s++) {
        // 1. Moure boles vives
        balls.forEach(ball => {
          if (!ball.alive) return;

          ball.x += ball.vx / SUB_STEPS;
          ball.y += ball.vy / SUB_STEPS;

          const dx = ball.x - CENTER.x;
          const dy = ball.y - CENTER.y;
          const dist = Math.hypot(dx, dy);

          // Rebot de paret: afegeix 1 nova corda
          if (dist >= ARENA_RADIUS - ball.radius) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            const dot = ball.vx * nx + ball.vy * ny;

            if (dot > 0) {
              let rx = (ball.vx - 2 * dot * nx) * INDIVIDUAL_BOUNCE_ACCEL;
              let ry = (ball.vy - 2 * dot * ny) * INDIVIDUAL_BOUNCE_ACCEL;

              const ang = Math.atan2(ry, rx) + (Math.random() - 0.5) * 0.10;
              const spd = Math.min(MAX_SPEED, Math.max(MIN_SPEED, Math.hypot(rx, ry)));
              ball.vx = Math.cos(ang) * spd;
              ball.vy = Math.sin(ang) * spd;

              ball.x = CENTER.x + nx * (ARENA_RADIUS - ball.radius);
              ball.y = CENTER.y + ny * (ARENA_RADIUS - ball.radius);

              if (ball.lines.length < MAX_LINES_PER_BALL) {
                ball.lines.push({
                  ax: CENTER.x + nx * ARENA_RADIUS,
                  ay: CENTER.y + ny * ARENA_RADIUS
                });
              }

              recordSoundHit(ball.id, false);
            }
          }
        });

        // 2. Rebot elàstic entre boles (billar)
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i], b2 = balls[j];
            if (!b1.alive || !b2.alive) continue;

            const cdx = b2.x - b1.x;
            const cdy = b2.y - b1.y;
            const cDist = Math.hypot(cdx, cdy);
            const minDist = b1.radius + b2.radius;

            if (cDist < minDist && cDist > 0) {
              const cnx = cdx / cDist;
              const cny = cdy / cDist;

              const overlap = minDist - cDist;
              b1.x -= cnx * (overlap * 0.5);
              b1.y -= cny * (overlap * 0.5);
              b2.x += cnx * (overlap * 0.5);
              b2.y += cny * (overlap * 0.5);

              const rvx = b1.vx - b2.vx;
              const rvy = b1.vy - b2.vy;
              const velAlongNorm = rvx * cnx + rvy * cny;

              if (velAlongNorm > 0) {
                b1.vx -= velAlongNorm * cnx;
                b1.vy -= velAlongNorm * cny;
                b2.vx += velAlongNorm * cnx;
                b2.vy += velAlongNorm * cny;

                recordSoundHit(8, false);
                if (cutSparks.length < 25) {
                  cutSparks.push({ x: (b1.x + b2.x) / 2, y: (b1.y + b2.y) / 2, life: 8, color: '#ffffff' });
                }
              }
            }
          }
        }

        // 3. Tall físic estricte de cordes rivals
        balls.forEach(cutter => {
          if (!cutter.alive || cutter.cutCooldownTimer > 0) return;

          balls.forEach(target => {
            if (!target.alive || target.id === cutter.id) return;

            for (let l = target.lines.length - 1; l >= 0; l--) {
              const line = target.lines[l];
              const d = distToSegment(cutter.x, cutter.y, line.ax, line.ay, target.x, target.y);

              if (d <= cutter.radius + 1.5) {
                target.lines.splice(l, 1);
                cutter.cutCooldownTimer = CUTTER_COOLDOWN;

                if (cutSparks.length < 25) {
                  cutSparks.push({ x: cutter.x, y: cutter.y, life: 10, color: target.color });
                }

                // Eliminació en quedar-se a 0 cordes
                if (target.lines.length === 0) {
                  target.alive = false;
                  spawnDeathBurst(target.x, target.y, target.color);

                  recordSoundHit(10, true);

                  const aliveList = balls.filter(b => b.alive);
                  if (aliveList.length === 1 && !isFinished) {
                    winner = aliveList[0];
                    window.winnerName = winner.name;
                    isFinished = true;

                    spawnWinnerConfetti(winner.color);

                    setTimeout(() => {
                      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        window.actualDuration = (performance.now() - startTime) / 1000;
                        mediaRecorder.stop();
                      }
                    }, 2400);
                  }
                }
                break;
              }
            }
          });
        });
      }

      // Esteles
      balls.forEach(ball => {
        if (!ball.alive) return;
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 12) ball.trail.shift();
      });
    }

    // ==========================================
    // 5. RENDERITZAT ULTRARÀPID
    // ==========================================
    function render() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // 1. Dibuix de cordes
      balls.forEach(ball => {
        if (!ball.alive || ball.lines.length === 0) return;

        ctx.strokeStyle = ball.color;
        ctx.lineWidth = 2.4;
        ctx.globalAlpha = 0.70;

        ctx.beginPath();
        for (let i = 0; i < ball.lines.length; i++) {
          ctx.moveTo(ball.lines[i].ax, ball.lines[i].ay);
          ctx.lineTo(ball.x, ball.y);
        }
        ctx.stroke();
      });
      ctx.globalAlpha = 1.0;

      // 2. Anell exterior
      ctx.save();
      ctx.strokeStyle = '#818cf8';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.arc(CENTER.x, CENTER.y, ARENA_RADIUS, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 3. Guspires de tall
      cutSparks.forEach(s => {
        s.life--;
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, 4, 4);
      });
      cutSparks = cutSparks.filter(s => s.life > 0);

      // 4. Partícules
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.life / 5), 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);

      // 5. Dibuixar boles vives
      balls.forEach(ball => {
        if (!ball.alive) return;

        for (let i = 0; i < ball.trail.length; i++) {
          const pt = ball.trail[i];
          const alpha = (i + 1) / ball.trail.length;
          ctx.fillStyle = ball.color;
          ctx.globalAlpha = alpha * 0.35;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, ball.radius * alpha * 0.75, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = ball.glowColor;
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Marca d'aigua
      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.textAlign = 'center';
      ctx.fillText('bouncelab.tv', CENTER.x, CENTER.y + 12);

      // 6. Marcador superior
      ctx.save();
      ctx.textAlign = 'center';

      if (isFinished && winner) {
        ctx.font = '900 68px sans-serif';
        ctx.fillStyle = winner.color;
        ctx.shadowBlur = 28;
        ctx.shadowColor = winner.color;
        ctx.fillText(`${winner.name} WINS! 🏆`, CENTER.x, 240);

        ctx.font = '800 36px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffffff';
        ctx.fillText('LAST BALL STANDING!', CENTER.x, 300);
      } else {
        ctx.font = '800 56px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 18;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
        ctx.fillText('LAST ONE STANDING! ⚔️', CENTER.x, 230);

        ctx.font = '700 30px sans-serif';
        const spacingX = Math.min(130, (WIDTH - 120) / balls.length);
        const startX = CENTER.x - ((balls.length - 1) * spacingX) / 2;

        balls.forEach((b, idx) => {
          const posX = startX + idx * spacingX;
          if (b.alive) {
            ctx.fillStyle = b.color;
            ctx.fillText(`${b.lines.length}`, posX, 290);
          } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.fillText('💀', posX, 290);
          }
        });
      }
      ctx.restore();

      const remainingAlive = balls.filter(b => b.alive).length;
      ctx.font = '700 34px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.textAlign = 'center';
      ctx.fillText(`ALIVE: ${remainingAlive} / ${balls.length}`, CENTER.x, HEIGHT - 230);

      updatePhysics();
      requestAnimationFrame(render);
    }

    // ==========================================
    // 6. GRAVADOR A 30 FPS
    // ==========================================
    let mediaRecorder;
    let recordedChunks = [];

    window.startRecording = function() {
      startTime = performance.now();
      isRunning = true;
      window.soundEvents = [];
      recordedChunks = [];

      // 30 FPS: PES REDUÏT A LA MEITAT
      const stream = canvas.captureStream(30);

      let mimeType = 'video/webm;codecs=vp8';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 4500000 // 4.5 Mbps (òptim per mòbil)
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      // Topall màxim: si arriba als 75s, s'assigna com a guanyadora la bola amb més cordes
      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          const aliveBalls = balls.filter(b => b.alive);
          if (aliveBalls.length > 0) {
            aliveBalls.sort((a, b) => b.lines.length - a.lines.length);
            winner = aliveBalls[0];
            window.winnerName = winner.name;
          }
          window.actualDuration = (performance.now() - startTime) / 1000;
          mediaRecorder.stop();
        }
      }, 76000);
    };

    render();
  </script>
</body>
</html>
