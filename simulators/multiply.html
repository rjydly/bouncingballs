<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab - Multiply Swarm Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Lexend', sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
    }
    .font-preload {
      position: absolute;
      left: -9999px;
      visibility: hidden;
      pointer-events: none;
    }
    .w700 { font-family: 'Lexend', sans-serif; font-weight: 700; }
    .w800 { font-family: 'Lexend', sans-serif; font-weight: 800; }
    .w900 { font-family: 'Lexend', sans-serif; font-weight: 900; }
  </style>
</head>
<body>
  <div class="font-preload w700">Preload Lexend 700</div>
  <div class="font-preload w800">Preload Lexend 800</div>
  <div class="font-preload w900">Preload Lexend 900</div>

  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ============================================================
    // 0. DEFINICIÓ INICIAL DE WINDOW
    // ============================================================
    window.soundEvents = [];
    window.actualDuration = 0;
    window.finalBalls = 1;

    let mediaRecorder = null;
    let recordedChunks = [];
    let startTime = null;
    let isRunning = false;
    let isFinished = false;
    let isEnding = false;

    window.startRecording = function() {
      console.log("Iniciant gravació del mode Multiply (fins a 2.000 boles)...");
      startTime = performance.now();
      isRunning = true;
      window.soundEvents = [];
      recordedChunks = [];

      const stream = canvas.captureStream(30);

      let mimeType = 'video/webm;codecs=vp8';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 4500000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          window.actualDuration = (performance.now() - startTime) / 1000;
          window.finalBalls = balls.length;
          mediaRecorder.stop();
        }
      }, 55000);
    };

    // ============================================================
    // 1. CONFIGURACIÓ GLOBAL I CONSTANTS FÍSIQUES
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

    const ARENA_RADIUS = 390;
    const BALL_RADIUS = 7.5;          // Mida optimitzada per encabir 2.000 boles
    const BALL_SPEED = 640;
    const GRAVITY = 780;
    const BOUNCE_RESTITUTION = 1.012;
    const MAX_SPEED = 920;

    const GAP_SIZE = 0.48;            // Obertura de l'escletxa
    const TARGET_BALLS = 1800;        // Finalitza en superar les 1.800-2.000 boles

    const NEON_PALETTE = [
      { color: '#00f2fe', glow: '#00f2fe' },
      { color: '#ff007f', glow: '#ff007f' },
      { color: '#39ff14', glow: '#39ff14' },
      { color: '#ffd700', glow: '#ffd700' },
      { color: '#b026ff', glow: '#b026ff' },
      { color: '#ff6600', glow: '#ff6600' },
      { color: '#ff2a2a', glow: '#ff2a2a' },
      { color: '#00ff88', glow: '#00ff88' }
    ];

    // COLOR ALEATORI PER AL CERCLE
    const ringColorIdx = Math.floor(Math.random() * NEON_PALETTE.length);
    const ringColorObj = NEON_PALETTE[ringColorIdx];

    // COLOR ALEATORI PER A LA BOLA INICIAL
    const ballColorIdx = Math.floor(Math.random() * NEON_PALETTE.length);
    const ballColorObj = NEON_PALETTE[ballColorIdx];

    function recordSound(type) {
      if (startTime !== null) {
        const timeSec = (performance.now() - startTime) / 1000;
        window.soundEvents.push({
          time: timeSec,
          type: type // Només 'spawn' quan surt una bola!
        });
      }
    }

    function isInGap(angle, gAngle) {
      let diff = Math.abs(angle - gAngle) % (Math.PI * 2);
      if (diff > Math.PI) diff = Math.PI * 2 - diff;
      return diff <= GAP_SIZE / 2;
    }

    // ============================================================
    // 2. CÀLCUL DEL PRIMER LLANÇAMENT (GARANTIT EN MENYS D'1.4s)
    // ============================================================
    let ring = {
      radius: ARENA_RADIUS,
      gapAngle: Math.random() * Math.PI * 2,
      rotSpeed: 0.58,
      color: ringColorObj.color,
      glow: ringColorObj.glow
    };

    function findQuickEscapeLaunch() {
      const testSpeeds = [620, 680, 740];
      let bestLaunch = null;
      let bestTime = Infinity;

      // Cerca exhaustiva de 360 angles x 3 velocitats (1.080 simulacions en 3ms)
      for (const spd of testSpeeds) {
        for (let a = 0; a < 360; a++) {
          const ang = (a / 360) * Math.PI * 2;
          const vx = Math.cos(ang) * spd;
          const vy = Math.sin(ang) * spd;

          let x = CENTER.x, y = CENTER.y - 40;
          let curVx = vx, curVy = vy;
          let gapAng = ring.gapAngle;
          let bounces = 0;
          let t = 0;
          const dt = 1 / 60;

          while (t < 1.45) {
            t += dt;
            gapAng = (gapAng + ring.rotSpeed * dt) % (Math.PI * 2);
            curVy += GRAVITY * dt;
            x += curVx * dt;
            y += curVy * dt;

            const dx = x - CENTER.x, dy = y - CENTER.y;
            const dist = Math.hypot(dx, dy);

            if (dist >= ARENA_RADIUS - BALL_RADIUS) {
              let hitAng = Math.atan2(dy, dx);
              if (hitAng < 0) hitAng += Math.PI * 2;

              if (isInGap(hitAng, gapAng)) {
                if (dist >= ARENA_RADIUS) {
                  if (t <= 1.35 && t < bestTime) {
                    bestTime = t;
                    bestLaunch = { vx, vy };
                  }
                  break;
                }
              } else {
                bounces++;
                if (bounces > 2) break;
                const nx = dx / (dist || 1), ny = dy / (dist || 1);
                const dot = curVx * nx + curVy * ny;
                if (dot > 0) {
                  curVx = (curVx - 2 * dot * nx) * BOUNCE_RESTITUTION;
                  curVy = (curVy - 2 * dot * ny) * BOUNCE_RESTITUTION;
                  x = CENTER.x + nx * (ARENA_RADIUS - BALL_RADIUS);
                  y = CENTER.y + ny * (ARENA_RADIUS - BALL_RADIUS);
                }
              }
            }
          }
        }
      }

      if (bestLaunch) {
        console.log(`🎯 Primer llançament calculat: sortirà en ${bestTime.toFixed(2)}s!`);
        return bestLaunch;
      }

      // Tret directe predit cap a la posició futura del forat
      const targetGapAng = (ring.gapAngle + ring.rotSpeed * 0.75) % (Math.PI * 2);
      const targetX = CENTER.x + Math.cos(targetGapAng) * ARENA_RADIUS;
      const targetY = CENTER.y + Math.sin(targetGapAng) * ARENA_RADIUS;
      const directAng = Math.atan2(targetY - (CENTER.y - 40), targetX - CENTER.x);
      return { vx: Math.cos(directAng) * 660, vy: Math.sin(directAng) * 660 };
    }

    const firstLaunch = findQuickEscapeLaunch();

    // Bola inicial amb color aleatori i tret calculat
    let balls = [{
      x: CENTER.x,
      y: CENTER.y - 40,
      vx: firstLaunch.vx,
      vy: firstLaunch.vy,
      color: ballColorObj.color,
      colorIdx: ballColorIdx
    }];

    let escapedBalls = [];

    function spawnTriplet() {
      // 1 surt -> 3 entren
      for (let i = 0; i < 3; i++) {
        const cIdx = Math.floor(Math.random() * NEON_PALETTE.length);
        const col = NEON_PALETTE[cIdx];
        const ang = Math.random() * Math.PI * 2;
        const spd = BALL_SPEED * (0.85 + Math.random() * 0.3);
        balls.push({
          x: CENTER.x + (Math.random() - 0.5) * 30,
          y: CENTER.y + (Math.random() - 0.5) * 30,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color: col.color,
          colorIdx: cIdx
        });
      }
      recordSound('spawn');
    }

    // ============================================================
    // 3. FÍSICA EN TEMPS REAL ULTRA OPTIMITZADA (FINS A 2.000 BOLES)
    // ============================================================
    function stepPhysics(fixedDt) {
      if (!isRunning || isFinished) return;

      ring.gapAngle = (ring.gapAngle + ring.rotSpeed * fixedDt) % (Math.PI * 2);

      // Finalització en superar les 1.800-2.000 boles
      if (balls.length >= TARGET_BALLS && !isEnding) {
        isEnding = true;
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            window.actualDuration = (performance.now() - startTime) / 1000;
            window.finalBalls = balls.length;
            isFinished = true;
            mediaRecorder.stop();
          }
        }, 1200);
      }

      // Moure boles interiors
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        b.vy += GRAVITY * fixedDt;
        b.x += b.vx * fixedDt;
        b.y += b.vy * fixedDt;

        const curSpd = Math.hypot(b.vx, b.vy);
        if (curSpd > MAX_SPEED) {
          b.vx = (b.vx / curSpd) * MAX_SPEED;
          b.vy = (b.vy / curSpd) * MAX_SPEED;
        }

        const dx = b.x - CENTER.x;
        const dy = b.y - CENTER.y;
        const dist = Math.hypot(dx, dy);

        let hitAng = Math.atan2(dy, dx);
        if (hitAng < 0) hitAng += Math.PI * 2;

        if (dist >= ARENA_RADIUS - BALL_RADIUS) {
          if (isInGap(hitAng, ring.gapAngle)) {
            // Surt lliurement pel forat
            if (dist >= ARENA_RADIUS) {
              balls.splice(i, 1);
              escapedBalls.push({
                x: b.x,
                y: b.y,
                vx: b.vx * 1.25,
                vy: b.vy * 1.25,
                color: b.color,
                life: 30
              });

              spawnTriplet();
              continue;
            }
          } else {
            // Rebot a la paret
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            const dot = b.vx * nx + b.vy * ny;
            if (dot > 0) {
              b.vx = (b.vx - 2 * dot * nx) * BOUNCE_RESTITUTION;
              b.vy = (b.vy - 2 * dot * ny) * BOUNCE_RESTITUTION;
              b.x = CENTER.x + nx * (ARENA_RADIUS - BALL_RADIUS);
              b.y = CENTER.y + ny * (ARENA_RADIUS - BALL_RADIUS);
            }
          }
        }
      }

      // Xocs entre boles només al principi (quan n'hi ha poques) per assegurar 60 FPS purs
      if (balls.length <= 40) {
        const minDist = BALL_RADIUS * 2;
        const minDistSq = minDist * minDist;

        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i], b2 = balls[j];
            const cdx = b2.x - b1.x;
            const cdy = b2.y - b1.y;

            if (Math.abs(cdx) < minDist && Math.abs(cdy) < minDist) {
              const distSq = cdx * cdx + cdy * cdy;
              if (distSq < minDistSq && distSq > 0.001) {
                const cdist = Math.sqrt(distSq);
                const cnx = cdx / cdist;
                const cny = cdy / cdist;
                const overlap = (minDist - cdist) * 0.5;

                b1.x -= cnx * overlap;
                b1.y -= cny * overlap;
                b2.x += cnx * overlap;
                b2.y += cny * overlap;

                const rvx = b1.vx - b2.vx;
                const rvy = b1.vy - b2.vy;
                const vNorm = rvx * cnx + rvy * cny;
                if (vNorm > 0) {
                  b1.vx -= vNorm * cnx;
                  b1.vy -= vNorm * cny;
                  b2.vx += vNorm * cnx;
                  b2.vy += vNorm * cny;
                }
              }
            }
          }
        }
      }

      // Moure boles escapades
      escapedBalls.forEach(eb => {
        eb.x += eb.vx * fixedDt;
        eb.y += eb.vy * fixedDt;
        eb.life--;
      });
      escapedBalls = escapedBalls.filter(eb => eb.life > 0);
      if (escapedBalls.length > 80) escapedBalls.shift();
    }

    // ============================================================
    // 4. RENDERITZAT PER LOTS DE COLOR (PER A 2.000 BOLES)
    // ============================================================
    let lastTime = null;
    let physicsAccumulator = 0;
    const FIXED_PHYSICS_STEP = 1 / 60;

    function render(currentTime) {
      if (!startTime) startTime = currentTime;
      if (!lastTime) lastTime = currentTime;
      const frameDelta = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      physicsAccumulator += frameDelta;
      while (physicsAccumulator >= FIXED_PHYSICS_STEP) {
        stepPhysics(FIXED_PHYSICS_STEP);
        physicsAccumulator -= FIXED_PHYSICS_STEP;
      }

      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Títol superior
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '800 52px Lexend, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('MULTIPLY CHALLENGE', CENTER.x, 260);

      ctx.font = '700 28px Lexend, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.fillText('1 ESCAPES  →  3 SPAWN (+3)', CENTER.x, 310);
      ctx.restore();

      // Dibuix de l'anell amb color aleatori
      ctx.save();
      ctx.shadowBlur = 24;
      ctx.shadowColor = ring.glow;
      ctx.strokeStyle = ring.color;
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';

      ctx.beginPath();
      const startGap = ring.gapAngle + GAP_SIZE / 2;
      const endGap = ring.gapAngle - GAP_SIZE / 2 + Math.PI * 2;
      ctx.arc(CENTER.x, CENTER.y, ARENA_RADIUS, startGap, endGap);
      ctx.stroke();
      ctx.restore();

      // Dibuix de boles escapades
      escapedBalls.forEach(eb => {
        ctx.save();
        ctx.globalAlpha = eb.life / 30;
        ctx.fillStyle = eb.color;
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // BATCH RENDERING: Dibuix agrupat per colors (60 FPS constants amb 2.000 boles)
      for (let c = 0; c < NEON_PALETTE.length; c++) {
        ctx.fillStyle = NEON_PALETTE[c].color;
        ctx.beginPath();
        for (let i = 0; i < balls.length; i++) {
          if (balls[i].colorIdx === c) {
            ctx.moveTo(balls[i].x + BALL_RADIUS, balls[i].y);
            ctx.arc(balls[i].x, balls[i].y, BALL_RADIUS, 0, Math.PI * 2);
          }
        }
        ctx.fill();
      }

      // Marcador de boles gegant
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '900 68px Lexend, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`BALLS: ${balls.length}`, CENTER.x, 390);
      ctx.restore();

      // Marca d'aigua inferior
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '700 28px Lexend, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.fillText('@bouncelab.tv', CENTER.x, HEIGHT - 220);
      ctx.restore();

      requestAnimationFrame(render);
    }

    document.fonts.ready.then(() => {
      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
