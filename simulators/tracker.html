<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab - Don't Lose The Red Ball</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ============================================================
    // 0. CONFIGURACIÓ GLOBAL
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };
    const ARENA_RADIUS = 390;
    const BALL_RADIUS = 22;
    const NUM_BALLS = 15;

    const COLOR_BLUE = '#38bdf8';
    const COLOR_RED = '#ef4444';

    window.soundEvents = [];
    window.actualDuration = 0;
    window.winnerName = "";

    function recordSound(type, note = 0) {
      if (startTime !== null) {
        const timeSec = (performance.now() - startTime) / 1000;
        window.soundEvents.push({
          time: timeSec,
          type: type, // 'tick', 'bounce', 'reveal', 'pop'
          note: note,
          isEscape: type === 'reveal'
        });
      }
    }

    // ============================================================
    // 1. GENERACIÓ DELS 15 SLOTS I LES BOLES
    // ============================================================
    const slots = [];
    for (let i = 0; i < NUM_BALLS; i++) {
      // Offset de mig pas com al vídeo original perquè el 1 i el 15 quedin a dalt
      const theta = -Math.PI / 2 + (2 * Math.PI / NUM_BALLS) * (i + 0.5);
      slots.push({
        number: i + 1,
        angle: theta,
        x: CENTER.x + Math.cos(theta) * ARENA_RADIUS,
        y: CENTER.y + Math.sin(theta) * ARENA_RADIUS,
        textX: CENTER.x + Math.cos(theta) * (ARENA_RADIUS + 58),
        textY: CENTER.y + Math.sin(theta) * (ARENA_RADIUS + 58)
      });
    }

    // Bola objectiu triada a l'atzar (1 a 15)
    const targetSlotIndex = Math.floor(Math.random() * NUM_BALLS);

    const balls = [];
    for (let i = 0; i < NUM_BALLS; i++) {
      balls.push({
        id: i + 1,
        isTarget: i === targetSlotIndex,
        x: slots[i].x,
        y: slots[i].y,
        vx: 0,
        vy: 0,
        radius: BALL_RADIUS,
        color: i === targetSlotIndex ? COLOR_RED : COLOR_BLUE,
        startX: slots[i].x,
        startY: slots[i].y,
        targetSlot: null
      });
    }

    // ============================================================
    // 2. FASES I TEMPORITZACIÓ
    // ============================================================
    // Fase 1: 0.0s a 3.0s  -> Countdown 3..2..1 (bola vermella visible)
    // Fase 2: 3.0s a 18.0s -> Shuffling caòtic 15s (totes vermelles, timer 15..1)
    // Fase 3: 18.0s a 19.8s -> Retorn suau a les posicions + aparició números
    // Fase 4: 19.8s a 22.0s -> Revelació guanyadora + celebració
    let startTime = null;
    let isRunning = false;
    let isFinished = false;

    let lastTickSecond = -1;
    let slotAssigned = false;
    let revealDone = false;

    // ============================================================
    // 3. FÍSICA DEL SHUFFLING (XOCS ELÀSTICS PURS)
    // ============================================================
    function initShufflePhysics() {
      const BASE_SPEED = 14.5;
      balls.forEach(b => {
        b.color = COLOR_RED; // Totes es tornen vermelles
        // Impuls cap a l'interior amb desviació aleatòria
        const toCenterAng = Math.atan2(CENTER.y - b.y, CENTER.x - b.x);
        const randAng = toCenterAng + (Math.random() - 0.5) * 1.2;
        const spd = BASE_SPEED + (Math.random() - 0.5) * 2;
        b.vx = Math.cos(randAng) * spd;
        b.vy = Math.sin(randAng) * spd;
      });
    }

    function updatePhysics(dt) {
      const SUB_STEPS = 6;
      const stepDt = dt / SUB_STEPS;

      for (let s = 0; s < SUB_STEPS; s++) {
        // 1. Desplaçament i rebot contra la paret circular
        balls.forEach(ball => {
          ball.x += ball.vx * stepDt;
          ball.y += ball.vy * stepDt;

          const dx = ball.x - CENTER.x;
          const dy = ball.y - CENTER.y;
          const dist = Math.hypot(dx, dy);

          if (dist >= ARENA_RADIUS - ball.radius) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            const dot = ball.vx * nx + ball.vy * ny;

            if (dot > 0) {
              // Rebot elàstic amb lleugera pertorbació per no fer bucles infinits
              const rx = ball.vx - 2 * dot * nx;
              const ry = ball.vy - 2 * dot * ny;
              const ang = Math.atan2(ry, rx) + (Math.random() - 0.5) * 0.08;
              const spd = Math.hypot(rx, ry);

              ball.vx = Math.cos(ang) * spd;
              ball.vy = Math.sin(ang) * spd;
              ball.x = CENTER.x + nx * (ARENA_RADIUS - ball.radius);
              ball.y = CENTER.y + ny * (ARENA_RADIUS - ball.radius);
            }
          }
        });

        // 2. Col·lisions elàstiques entre boles (billar)
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i], b2 = balls[j];
            const cdx = b2.x - b1.x;
            const cdy = b2.y - b1.y;
            const dist = Math.hypot(cdx, cdy);
            const minDist = b1.radius + b2.radius;

            if (dist < minDist && dist > 0) {
              const cnx = cdx / dist;
              const cny = cdy / dist;

              // Separar per evitar solapament
              const overlap = (minDist - dist) * 0.5;
              b1.x -= cnx * overlap;
              b1.y -= cny * overlap;
              b2.x += cnx * overlap;
              b2.y += cny * overlap;

              // Transferència d'impuls elàstica
              const rvx = b1.vx - b2.vx;
              const rvy = b1.vy - b2.vy;
              const velNorm = rvx * cnx + rvy * cny;

              if (velNorm > 0) {
                b1.vx -= velNorm * cnx;
                b1.vy -= velNorm * cny;
                b2.vx += velNorm * cnx;
                b2.vy += velNorm * cny;
              }
            }
          }
        }
      }
    }

    // Assignació òptima dels 15 slots finals
    function assignFinalSlots() {
      const available = [...slots];
      // Assignem primer la bola objectiu al slot més proper per fluïdesa
      const targetBall = balls.find(b => b.isTarget);
      available.sort((a, b) => Math.hypot(targetBall.x - a.x, targetBall.y - a.y) - Math.hypot(targetBall.x - b.x, targetBall.y - b.y));
      targetBall.targetSlot = available.shift();
      targetBall.startX = targetBall.x;
      targetBall.startY = targetBall.y;

      window.winnerName = targetBall.targetSlot.number.toString();

      // Assignem la resta de boles
      const otherBalls = balls.filter(b => !b.isTarget);
      otherBalls.forEach(ball => {
        available.sort((a, b) => Math.hypot(ball.x - a.x, ball.y - a.y) - Math.hypot(ball.x - b.x, ball.y - b.y));
        ball.targetSlot = available.shift();
        ball.startX = ball.x;
        ball.startY = ball.y;
      });
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // ============================================================
    // 4. BUCLE DE RENDERITZAT VISUAL
    // ============================================================
    let lastTime = null;

    function render(currentTime) {
      if (!startTime) startTime = currentTime;
      if (!lastTime) lastTime = currentTime;
      const elapsed = (currentTime - startTime) / 1000;
      const dt = Math.min((currentTime - lastTime) / 1000, 0.05);
      lastTime = currentTime;

      // Fons negre profund
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Títol superior amb 'red ball' ressaltat
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '800 52px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      
      const titlePrefix = "Don't lose the ";
      const titleHighlight = "red ball";
      const totalWidth = ctx.measureText(titlePrefix).width + ctx.measureText(titleHighlight).width;
      const startX = CENTER.x - totalWidth / 2;

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.fillText(titlePrefix, startX, 330);
      ctx.fillStyle = COLOR_RED;
      ctx.fillText(titleHighlight, startX + ctx.measureText(titlePrefix).width, 330);
      ctx.restore();

      // Marca d'aigua inferior
      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.textAlign = 'center';
      ctx.fillText('@bouncelab.tv', CENTER.x, 1680);

      // Anell blanc de l'arena
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(CENTER.x, CENTER.y, ARENA_RADIUS, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // ============================================================
      // LOGICA DE FASES
      // ============================================================
      if (isRunning) {
        if (elapsed < 3.0) {
          // ------------------------------------------------------------
          // FASE 1: COUNTDOWN 3.. 2.. 1..
          // ------------------------------------------------------------
          const countdown = Math.ceil(3.0 - elapsed);
          if (countdown !== lastTickSecond) {
            lastTickSecond = countdown;
            recordSound('tick', countdown);
          }

          // Dibuixar número central
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.font = '900 250px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(countdown.toString(), CENTER.x, CENTER.y);
          ctx.restore();

          // Dibuixar els números 1..15 al voltant
          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.font = '700 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          slots.forEach(s => ctx.fillText(s.number.toString(), s.textX, s.textY));
          ctx.restore();

          // Fletxa i text 'FOLLOW THE BALL'
          const targetBall = balls.find(b => b.isTarget);
          if (targetBall) {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.textAlign = 'center';
            ctx.font = '800 24px sans-serif';

            // Càlcul de posició de la fletxa
            const dirX = Math.cos(slots[targetSlotIndex].angle);
            const dirY = Math.sin(slots[targetSlotIndex].angle);
            const arrowX = targetBall.x + dirX * 65;
            const arrowY = targetBall.y + dirY * 65;

            // Fletxa apuntant a la bola
            ctx.beginPath();
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(targetBall.x + dirX * 32, targetBall.y + dirY * 32);
            ctx.stroke();

            ctx.fillText('FOLLOW THE BALL', arrowX + dirX * 130, arrowY + dirY * 30);
            ctx.restore();
          }

        } else if (elapsed < 18.0) {
          // ------------------------------------------------------------
          // FASE 2: SHUFFLING CAÒTIC (15s)
          // ------------------------------------------------------------
          if (lastTickSecond === -1 || lastTickSecond > 15) {
            initShufflePhysics();
          }

          const timeLeft = Math.max(1, Math.ceil(18.0 - elapsed));
          if (timeLeft !== lastTickSecond) {
            lastTickSecond = timeLeft;
            recordSound('tick', timeLeft);
          }

          // Comptador gran al fons del centre
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.13)';
          ctx.font = '900 250px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(timeLeft.toString(), CENTER.x, CENTER.y);
          ctx.restore();

          // Executar la física
          updatePhysics(dt);

        } else if (elapsed < 19.8) {
          // ------------------------------------------------------------
          // FASE 3: RETORN SUAU A LES POSICIONS I NÚMEROS
          // ------------------------------------------------------------
          if (!slotAssigned) {
            assignFinalSlots();
            slotAssigned = true;
          }

          const progress = Math.min(1.0, (elapsed - 18.0) / 1.3);
          const eased = easeInOutCubic(progress);

          balls.forEach(b => {
            b.x = b.startX + (b.targetSlot.x - b.startX) * eased;
            b.y = b.startY + (b.targetSlot.y - b.startY) * eased;
          });

          // Revelació seqüencial dels números 1..15 en sentit horari
          const numRevealProgress = Math.min(NUM_BALLS, Math.floor(((elapsed - 18.1) / 1.4) * NUM_BALLS));
          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.font = '700 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          for (let i = 0; i < numRevealProgress; i++) {
            ctx.fillText(slots[i].number.toString(), slots[i].textX, slots[i].textY);
          }
          ctx.restore();

        } else {
          // ------------------------------------------------------------
          // FASE 4: REVELACIÓ GUANYADORA
          // ------------------------------------------------------------
          // Tots els números visibles
          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.font = '700 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          slots.forEach(s => ctx.fillText(s.number.toString(), s.textX, s.textY));
          ctx.restore();

          // Col·locar al slot exacte
          balls.forEach(b => {
            b.x = b.targetSlot.x;
            b.y = b.targetSlot.y;
            b.color = b.isTarget ? COLOR_RED : COLOR_BLUE;
          });

          const winningBall = balls.find(b => b.isTarget);

          if (!revealDone) {
            revealDone = true;
            recordSound('reveal', 10);
          }

          // Fletxa assenyalant la bola guanyadora
          if (winningBall) {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            
            // Fletxa des de fora apuntant cap a la bola
            const dirX = Math.cos(winningBall.targetSlot.angle);
            const dirY = Math.sin(winningBall.targetSlot.angle);
            const arrowStartX = winningBall.x + dirX * 105;
            const arrowStartY = winningBall.y + dirY * 105;
            const arrowEndX = winningBall.x + dirX * 40;
            const arrowEndY = winningBall.y + dirY * 40;

            ctx.beginPath();
            ctx.moveTo(arrowStartX, arrowStartY);
            ctx.lineTo(arrowEndX, arrowEndY);
            ctx.stroke();

            // Punta de fletxa
            const headlen = 16;
            const angle = Math.atan2(arrowEndY - arrowStartY, arrowEndX - arrowStartX);
            ctx.beginPath();
            ctx.moveTo(arrowEndX, arrowEndY);
            ctx.lineTo(arrowEndX - headlen * Math.cos(angle - Math.PI / 6), arrowEndY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(arrowEndX - headlen * Math.cos(angle + Math.PI / 6), arrowEndY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.restore();
          }

          if (elapsed > 21.5 && mediaRecorder && mediaRecorder.state !== 'inactive' && !isFinished) {
            isFinished = true;
            window.actualDuration = elapsed;
            mediaRecorder.stop();
          }
        }
      }

      // ============================================================
      // DIBUIX DE LES 15 BOLES
      // ============================================================
      balls.forEach(ball => {
        ctx.save();
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      requestAnimationFrame(render);
    }

    // ============================================================
    // 5. ENREGISTRAMENT AMB MEDIARECORDER
    // ============================================================
    let mediaRecorder;
    let recordedChunks = [];

    window.startRecording = function() {
      startTime = performance.now();
      isRunning = true;
      window.soundEvents = [];
      recordedChunks = [];

      const stream = canvas.captureStream(30);

      let mimeType = 'video/webm;codecs=vp8';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 4500000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      // Topall de seguretat
      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          window.actualDuration = (performance.now() - startTime) / 1000;
          mediaRecorder.stop();
        }
      }, 23000);
    };

    requestAnimationFrame(render);
  </script>
</body>
</html>
