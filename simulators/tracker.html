<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab - Don't Lose The Red Ball</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ============================================================
    // 0. CONFIGURACIÓ GLOBAL I RADIS CONCÈNTRICS
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

    // Jerarquia de radis: Paret exterior > Números > Boles interiors
    const ARENA_RADIUS = 425;      // Línia blanca exterior (mur de rebot)
    const NUMBER_RADIUS = 355;     // Anell on es pinten els números 1..15
    const BALL_REST_RADIUS = 275;  // Anell interior on reposen les 15 boles
    const BALL_RADIUS = 22;
    const NUM_BALLS = 15;
    const BALL_SPEED = 620;        // Velocitat dinàmica i fluida (px/s)

    const COLOR_BLUE = '#38bdf8';
    const COLOR_RED = '#ef4444';

    window.soundEvents = [];
    window.actualDuration = 0;
    window.winnerName = "";

    function recordSound(type, note = 0) {
      if (startTime !== null) {
        const timeSec = (performance.now() - startTime) / 1000;
        window.soundEvents.push({
          time: timeSec,
          type: type, // 'tick', 'pop', 'reveal'
          note: note,
          isEscape: type === 'reveal'
        });
      }
    }

    // ============================================================
    // 1. GENERACIÓ DELS 15 SLOTS I LES BOLES
    // ============================================================
    const slots = [];
    for (let i = 0; i < NUM_BALLS; i++) {
      // Offset de mig pas perquè el 1 i el 15 quedin centrats a dalt
      const theta = -Math.PI / 2 + (2 * Math.PI / NUM_BALLS) * (i + 0.5);
      slots.push({
        number: i + 1,
        angle: theta,
        // Posició de la bola en repòs (CERCLE INTERIOR)
        x: CENTER.x + Math.cos(theta) * BALL_REST_RADIUS,
        y: CENTER.y + Math.sin(theta) * BALL_REST_RADIUS,
        // Posició del número (ENTRE LES BOLES I LA LÍNIA BLANCA)
        textX: CENTER.x + Math.cos(theta) * NUMBER_RADIUS,
        textY: CENTER.y + Math.sin(theta) * NUMBER_RADIUS
      });
    }

    const targetSlotIndex = Math.floor(Math.random() * NUM_BALLS);

    const balls = [];
    for (let i = 0; i < NUM_BALLS; i++) {
      balls.push({
        id: i + 1,
        isTarget: i === targetSlotIndex,
        x: slots[i].x,
        y: slots[i].y,
        vx: 0,
        vy: 0,
        radius: BALL_RADIUS,
        color: i === targetSlotIndex ? COLOR_RED : COLOR_BLUE,
        startX: slots[i].x,
        startY: slots[i].y,
        targetSlot: null
      });
    }

    let startTime = null;
    let isRunning = false;
    let isFinished = false;

    let shuffleStarted = false;
    let slotAssigned = false;
    let revealDone = false;
    let lastTickSecond = -1;
    let lastRevealedNumIndex = 0;

    // ============================================================
    // 2. FÍSICA DEL SHUFFLING (TOTA L'ARENA GRAN)
    // ============================================================
    function initShufflePhysics() {
      balls.forEach(b => {
        b.color = COLOR_RED; // Totes es tornen vermelles
        // Impuls aleatori en totes direccions per ocupar tota l'arena
        const randAng = Math.random() * Math.PI * 2;
        b.vx = Math.cos(randAng) * BALL_SPEED;
        b.vy = Math.sin(randAng) * BALL_SPEED;
      });
    }

    function updatePhysics(dt) {
      const SUB_STEPS = 6;
      const stepDt = dt / SUB_STEPS;

      for (let s = 0; s < SUB_STEPS; s++) {
        // 1. Moure boles i rebotar contra la paret blanca exterior
        balls.forEach(ball => {
          ball.x += ball.vx * stepDt;
          ball.y += ball.vy * stepDt;

          const dx = ball.x - CENTER.x;
          const dy = ball.y - CENTER.y;
          const dist = Math.hypot(dx, dy);
          const maxDist = ARENA_RADIUS - ball.radius;

          if (dist >= maxDist) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            const dot = ball.vx * nx + ball.vy * ny;

            if (dot > 0) {
              const rx = ball.vx - 2 * dot * nx;
              const ry = ball.vy - 2 * dot * ny;
              const ang = Math.atan2(ry, rx) + (Math.random() - 0.5) * 0.06;

              ball.vx = Math.cos(ang) * BALL_SPEED;
              ball.vy = Math.sin(ang) * BALL_SPEED;
              ball.x = CENTER.x + nx * maxDist;
              ball.y = CENTER.y + ny * maxDist;
            }
          }
        });

        // 2. Xoc elàstic entre boles
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i], b2 = balls[j];
            const cdx = b2.x - b1.x;
            const cdy = b2.y - b1.y;
            const dist = Math.hypot(cdx, cdy);
            const minDist = b1.radius + b2.radius;

            if (dist < minDist && dist > 0.001) {
              const cnx = cdx / dist;
              const cny = cdy / dist;

              const overlap = (minDist - dist) * 0.5;
              b1.x -= cnx * overlap;
              b1.y -= cny * overlap;
              b2.x += cnx * overlap;
              b2.y += cny * overlap;

              const rvx = b1.vx - b2.vx;
              const rvy = b1.vy - b2.vy;
              const velNorm = rvx * cnx + rvy * cny;

              if (velNorm > 0) {
                b1.vx -= velNorm * cnx;
                b1.vy -= velNorm * cny;
                b2.vx += velNorm * cnx;
                b2.vy += velNorm * cny;

                const spd1 = Math.hypot(b1.vx, b1.vy) || 1;
                b1.vx = (b1.vx / spd1) * BALL_SPEED;
                b1.vy = (b1.vy / spd1) * BALL_SPEED;

                const spd2 = Math.hypot(b2.vx, b2.vy) || 1;
                b2.vx = (b2.vx / spd2) * BALL_SPEED;
                b2.vy = (b2.vy / spd2) * BALL_SPEED;
              }
            }
          }
        }
      }
    }

    function assignFinalSlots() {
      const available = [...slots];
      const targetBall = balls.find(b => b.isTarget);
      available.sort((a, b) => Math.hypot(targetBall.x - a.x, targetBall.y - a.y) - Math.hypot(targetBall.x - b.x, targetBall.y - b.y));
      targetBall.targetSlot = available.shift();
      targetBall.startX = targetBall.x;
      targetBall.startY = targetBall.y;

      window.winnerName = targetBall.targetSlot.number.toString();

      const otherBalls = balls.filter(b => !b.isTarget);
      otherBalls.forEach(ball => {
        available.sort((a, b) => Math.hypot(ball.x - a.x, ball.y - a.y) - Math.hypot(ball.x - b.x, ball.y - b.y));
        ball.targetSlot = available.shift();
        ball.startX = ball.x;
        ball.startY = ball.y;
      });
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // ============================================================
    // 3. RENDERITZAT I CONTROL DE FASES
    // ============================================================
    let lastTime = null;

    function render(currentTime) {
      if (!startTime) startTime = currentTime;
      if (!lastTime) lastTime = currentTime;
      const elapsed = (currentTime - startTime) / 1000;
      const dt = Math.min((currentTime - lastTime) / 1000, 0.05);
      lastTime = currentTime;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Títol
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '800 52px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      
      const titlePrefix = "Don't lose the ";
      const titleHighlight = "red ball";
      const totalWidth = ctx.measureText(titlePrefix).width + ctx.measureText(titleHighlight).width;
      const startX = CENTER.x - totalWidth / 2;

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.fillText(titlePrefix, startX, 320);
      ctx.fillStyle = COLOR_RED;
      ctx.fillText(titleHighlight, startX + ctx.measureText(titlePrefix).width, 320);
      ctx.restore();

      // Marca d'aigua
      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.textAlign = 'center';
      ctx.fillText('@bouncelab.tv', CENTER.x, 1690);

      // Línia blanca de l'arena exterior
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(CENTER.x, CENTER.y, ARENA_RADIUS, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      if (isRunning) {
        if (elapsed < 3.0) {
          // FASE 1: COUNTDOWN 3.. 2.. 1..
          const countdown = Math.max(1, Math.ceil(3.0 - elapsed));
          if (countdown !== lastTickSecond) {
            lastTickSecond = countdown;
            recordSound('tick', countdown);
          }

          // Número gran al centre
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.font = '900 240px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(countdown.toString(), CENTER.x, CENTER.y);
          ctx.restore();

          // Dibuixar els números 1..15 entre les boles i la línia blanca
          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.font = '700 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          slots.forEach(s => ctx.fillText(s.number.toString(), s.textX, s.textY));
          ctx.restore();

          // Fletxa i text 'FOLLOW THE BALL'
          const targetBall = balls.find(b => b.isTarget);
          if (targetBall) {
            const dirX = Math.cos(slots[targetSlotIndex].angle);
            const dirY = Math.sin(slots[targetSlotIndex].angle);

            const arrowStartX = targetBall.x + dirX * 65;
            const arrowStartY = targetBall.y + dirY * 65;
            const arrowEndX = targetBall.x + dirX * 28;
            const arrowEndY = targetBall.y + dirY * 28;

            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;

            // Cos de la fletxa
            ctx.beginPath();
            ctx.moveTo(arrowStartX, arrowStartY);
            ctx.lineTo(arrowEndX, arrowEndY);
            ctx.stroke();

            // Cap de la fletxa
            const headlen = 12;
            const angle = Math.atan2(arrowEndY - arrowStartY, arrowEndX - arrowStartX);
            ctx.beginPath();
            ctx.moveTo(arrowEndX, arrowEndY);
            ctx.lineTo(arrowEndX - headlen * Math.cos(angle - Math.PI / 6), arrowEndY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(arrowEndX - headlen * Math.cos(angle + Math.PI / 6), arrowEndY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();

            // Text
            ctx.font = '800 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('FOLLOW THE BALL', arrowStartX + dirX * 115, arrowStartY + dirY * 24);
            ctx.restore();
          }

        } else if (elapsed < 18.0) {
          // FASE 2: SHUFFLING CAÒTIC (15s)
          if (!shuffleStarted) {
            shuffleStarted = true;
            initShufflePhysics();
            lastTickSecond = 16;
          }

          const timeLeft = Math.max(1, Math.ceil(18.0 - elapsed));
          if (timeLeft !== lastTickSecond) {
            lastTickSecond = timeLeft;
            recordSound('tick', timeLeft);
          }

          // Comptador gran al centre
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.13)';
          ctx.font = '900 240px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(timeLeft.toString(), CENTER.x, CENTER.y);
          ctx.restore();

          updatePhysics(dt);

        } else if (elapsed < 19.8) {
          // FASE 3: RETORN SUAU AL CERCLE INTERIOR I APARICIÓ DE NÚMEROS
          if (!slotAssigned) {
            assignFinalSlots();
            slotAssigned = true;
          }

          const progress = Math.min(1.0, (elapsed - 18.0) / 1.3);
          const eased = easeInOutCubic(progress);

          balls.forEach(b => {
            b.x = b.startX + (b.targetSlot.x - b.startX) * eased;
            b.y = b.startY + (b.targetSlot.y - b.startY) * eased;
          });

          // Revelació seqüencial dels números 1..15 en sentit horari
          const numRevealProgress = Math.min(NUM_BALLS, Math.floor(((elapsed - 18.1) / 1.4) * NUM_BALLS));
          if (numRevealProgress > lastRevealedNumIndex && numRevealProgress > 0) {
            for (let k = lastRevealedNumIndex + 1; k <= numRevealProgress; k++) {
              recordSound('pop', k);
            }
            lastRevealedNumIndex = numRevealProgress;
          }

          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.font = '700 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          for (let i = 0; i < numRevealProgress; i++) {
            ctx.fillText(slots[i].number.toString(), slots[i].textX, slots[i].textY);
          }
          ctx.restore();

        } else {
          // FASE 4: REVELACIÓ GUANYADORA
          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.font = '700 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          slots.forEach(s => ctx.fillText(s.number.toString(), s.textX, s.textY));
          ctx.restore();

          balls.forEach(b => {
            b.x = b.targetSlot.x;
            b.y = b.targetSlot.y;
            b.color = b.isTarget ? COLOR_RED : COLOR_BLUE;
          });

          const winningBall = balls.find(b => b.isTarget);

          if (!revealDone) {
            revealDone = true;
            recordSound('reveal', 10);
          }

          if (winningBall) {
            const dirX = Math.cos(winningBall.targetSlot.angle);
            const dirY = Math.sin(winningBall.targetSlot.angle);

            // Fletxa des de fora apuntant cap a la bola
            const arrowStartX = winningBall.x + dirX * 65;
            const arrowStartY = winningBall.y + dirY * 65;
            const arrowEndX = winningBall.x + dirX * 28;
            const arrowEndY = winningBall.y + dirY * 28;

            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3.5;

            ctx.beginPath();
            ctx.moveTo(arrowStartX, arrowStartY);
            ctx.lineTo(arrowEndX, arrowEndY);
            ctx.stroke();

            const headlen = 14;
            const angle = Math.atan2(arrowEndY - arrowStartY, arrowEndX - arrowStartX);
            ctx.beginPath();
            ctx.moveTo(arrowEndX, arrowEndY);
            ctx.lineTo(arrowEndX - headlen * Math.cos(angle - Math.PI / 6), arrowEndY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(arrowEndX - headlen * Math.cos(angle + Math.PI / 6), arrowEndY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();
            ctx.restore();
          }

          if (elapsed > 21.6 && mediaRecorder && mediaRecorder.state !== 'inactive' && !isFinished) {
            isFinished = true;
            window.actualDuration = elapsed;
            mediaRecorder.stop();
          }
        }
      }

      // Dibuixar boles
      balls.forEach(ball => {
        ctx.save();
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      requestAnimationFrame(render);
    }

    // ============================================================
    // 4. MEDIARECORDER
    // ============================================================
    let mediaRecorder;
    let recordedChunks = [];

    window.startRecording = function() {
      startTime = performance.now();
      isRunning = true;
      window.soundEvents = [];
      recordedChunks = [];

      const stream = canvas.captureStream(30);

      let mimeType = 'video/webm;codecs=vp8';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 4500000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          window.actualDuration = (performance.now() - startTime) / 1000;
          mediaRecorder.stop();
        }
      }, 23000);
    };

    requestAnimationFrame(render);
  </script>
</body>
</html>
