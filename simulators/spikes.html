<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab - Touch The Spike Lose The Ball</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Lexend', sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
    }
    .font-preload {
      position: absolute;
      left: -9999px;
      visibility: hidden;
      pointer-events: none;
    }
    .w700 { font-family: 'Lexend', sans-serif; font-weight: 700; }
    .w800 { font-family: 'Lexend', sans-serif; font-weight: 800; }
    .w900 { font-family: 'Lexend', sans-serif; font-weight: 900; }
  </style>
</head>
<body>
  <div class="font-preload w700">Preload Lexend 700</div>
  <div class="font-preload w800">Preload Lexend 800</div>
  <div class="font-preload w900">Preload Lexend 900</div>

  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ============================================================
    // 0. CONFIGURACIÓ GLOBAL I CONSTANTS FÍSIQUES
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

    const ARENA_RADIUS = 415;
    const SPIKE_HEIGHT = 48;          // Alçada de les punxes afilades
    const BALL_RADIUS = 27;           // Boles més grans (vives i mortes)
    const GRAVITY = 950;              // Gravetat realista cap avall (px/s²)
    const INITIAL_SPEED = 620;
    const BOUNCE_RESTITUTION = 1.018; // Rebot elàstic amb bona energia
    const MAX_SPEED = 920;
    const MIN_SPEED = 380;

    // Línia interior de les puntes dels spikes
    const R_SPIKE_TIPS = ARENA_RADIUS - SPIKE_HEIGHT;

    // Escletxa fixa a la part inferior-esquerra (~135 graus / 7:30h)
    const GAP_ANGLE = 2.35;
    const GAP_SIZE = 0.44;            // Obertura neta d'escapada
    const NUM_SPIKES = 42;            // Nombre de punxes contínues

    // Filtre matemàtic de durada (25s a 60s)
    const STRICT_MIN_DURATION = 25.0;
    const STRICT_MAX_DURATION = 60.0;

    const NEON_PALETTE = [
      { color: '#00f2fe', glow: '#00f2fe' },
      { color: '#ff007f', glow: '#ff007f' },
      { color: '#39ff14', glow: '#39ff14' },
      { color: '#ffd700', glow: '#ffd700' },
      { color: '#b026ff', glow: '#b026ff' },
      { color: '#ff6600', glow: '#ff6600' },
      { color: '#ff2a2a', glow: '#ff2a2a' },
      { color: '#1e90ff', glow: '#1e90ff' }
    ];

    window.soundEvents = [];
    window.actualDuration = 0;
    window.winnerName = "";
    window.frozenCount = 0;

    let startTime = null;
    let isRunning = false;
    let isFinished = false;

    function recordSound(type, note = 0) {
      if (startTime !== null) {
        const timeSec = (performance.now() - startTime) / 1000;
        window.soundEvents.push({
          time: timeSec,
          type: type, // 'burst', 'bounce', 'reveal'
          note: note,
          isEscape: type === 'reveal'
        });
      }
    }

    function createPRNG(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return function() {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function isInGap(angle) {
      let diff = Math.abs(angle - GAP_ANGLE) % (Math.PI * 2);
      if (diff > Math.PI) diff = Math.PI * 2 - diff;
      return diff <= GAP_SIZE / 2;
    }

    // ============================================================
    // 1. PRE-SIMULACIÓ (DIRECCIÓ I VELOCITAT IDÈNTICA PER A TOTES)
    // ============================================================
    function simulateCandidate(seed) {
      const rnd = createPRNG(seed);
      let simTime = 0;
      let deadBalls = [];

      // PUNT DE SORTIDA I VELOCITAT INICIAL FIXA PER A TOTES LES BOLES
      const spawnX = CENTER.x;
      const spawnY = CENTER.y - 80;
      const launchAng = rnd() * Math.PI * 2;
      const launchSpd = INITIAL_SPEED + (rnd() - 0.5) * 60;
      const vx0 = Math.cos(launchAng) * launchSpd;
      const vy0 = Math.sin(launchAng) * launchSpd;

      let b = { x: spawnX, y: spawnY, vx: vx0, vy: vy0, lifetime: 0 };

      const DT = 1 / 60;
      const MAX_SIM_TIME = STRICT_MAX_DURATION + 1.0;

      while (simTime < MAX_SIM_TIME) {
        simTime += DT;
        b.lifetime += DT;

        b.vy += GRAVITY * DT;
        b.x += b.vx * DT;
        b.y += b.vy * DT;

        const spd = Math.hypot(b.vx, b.vy);
        if (spd > MAX_SPEED) {
          b.vx = (b.vx / spd) * MAX_SPEED;
          b.vy = (b.vy / spd) * MAX_SPEED;
        } else if (spd < MIN_SPEED && spd > 0.001) {
          b.vx = (b.vx / spd) * MIN_SPEED;
          b.vy = (b.vy / spd) * MIN_SPEED;
        }

        const dx = b.x - CENTER.x;
        const dy = b.y - CENTER.y;
        const dist = Math.hypot(dx, dy);

        let hitAng = Math.atan2(dy, dx);
        if (hitAng < 0) hitAng += Math.PI * 2;

        // 1. Rebot net contra boles grises mortes (escuts protectors)
        let hitDead = false;
        for (let i = 0; i < deadBalls.length; i++) {
          const d = deadBalls[i];
          const ddx = b.x - d.x;
          const ddy = b.y - d.y;
          const ddist = Math.hypot(ddx, ddy);
          const minDist = BALL_RADIUS * 2;

          if (ddist < minDist && ddist > 0.001) {
            const fnx = ddx / ddist;
            const fny = ddy / ddist;
            const fdot = b.vx * fnx + b.vy * fny;
            if (fdot < 0) {
              b.vx = (b.vx - 2 * fdot * fnx) * BOUNCE_RESTITUTION;
              b.vy = (b.vy - 2 * fdot * fny) * BOUNCE_RESTITUTION;
              b.x = d.x + fnx * minDist;
              b.y = d.y + fny * minDist;
            }
            hitDead = true;
            break;
          }
        }

        if (hitDead) continue;

        // 2. Comprovació d'escletxa i punxes
        if (isInGap(hitAng)) {
          // Ha passat per l'escletxa!
          if (dist > ARENA_RADIUS + BALL_RADIUS + 10) {
            if (simTime >= STRICT_MIN_DURATION && simTime <= STRICT_MAX_DURATION && deadBalls.length >= 4) {
              return { success: true, duration: simTime, deadCount: deadBalls.length, seed, vx0, vy0 };
            }
            return { success: false, duration: simTime };
          }
        } else {
          // MOR TAN BON PUNT TOCA LA PUNTA D'UN SPIKE!
          if (dist + BALL_RADIUS >= R_SPIKE_TIPS) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);

            // La bola morta es col·loca just a la punta per fer d'escut cap a l'interior
            const deadX = CENTER.x + nx * (R_SPIKE_TIPS + BALL_RADIUS * 0.15);
            const deadY = CENTER.y + ny * (R_SPIKE_TIPS + BALL_RADIUS * 0.15);
            deadBalls.push({ x: deadX, y: deadY });

            // La següent bola surt amb la mateixa velocitat i posició inicial
            b = { x: spawnX, y: spawnY, vx: vx0, vy: vy0, lifetime: 0 };
          }
        }

        if (b.lifetime > 12.0) {
          return { success: false, duration: simTime };
        }
      }

      return { success: false, duration: simTime };
    }

    function findBestSimulation() {
      console.log(`🔍 Cercant partida amb efecte dòmino (${STRICT_MIN_DURATION}s - ${STRICT_MAX_DURATION}s)...`);
      let bestFallback = { seed: 104, vx0: 380, vy0: 420, deadCount: 6 };

      for (let s = 1; s < 2000; s++) {
        const res = simulateCandidate(s);
        if (res.success) {
          console.log(`✅ PARTIDA DÒMINO TROBADA (Intent #${s})! Durada: ${res.duration.toFixed(1)}s, Sacrificis: ${res.deadCount}`);
          return res;
        }
      }
      return bestFallback;
    }

    const optimalMatch = findBestSimulation();
    const optimalSeed = optimalMatch.seed;
    const gameRND = createPRNG(optimalSeed);

    // VALORS INICIALS COMPARTITS PER A TOTES LES BOLES D'AQUEST VÍDEO
    const SPAWN_X = CENTER.x;
    const SPAWN_Y = CENTER.y - 80;
    const INITIAL_VX = optimalMatch.vx0;
    const INITIAL_VY = optimalMatch.vy0;

    // ============================================================
    // 2. ESTAT DEL JOC
    // ============================================================
    let deadBalls = [];
    let currentBallNumber = 1;

    let currentBallColor = NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)];

    let activeBall = {
      x: SPAWN_X,
      y: SPAWN_Y,
      vx: INITIAL_VX,
      vy: INITIAL_VY,
      color: currentBallColor.color,
      glow: currentBallColor.glow,
      trail: []
    };

    let particles = [];
    let ringShatterParticles = [];
    let hasEscaped = false;

    function spawnDeathBurst(x, y, colorStr) {
      for (let i = 0; i < 40; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 14;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 30,
          color: colorStr
        });
      }
    }

    function spawnRingShatter() {
      for (let i = 0; i < 280; i++) {
        const ang = Math.random() * Math.PI * 2;
        const r = ARENA_RADIUS - 20 + Math.random() * 40;
        const spd = 6 + Math.random() * 26;
        ringShatterParticles.push({
          x: CENTER.x + Math.cos(ang) * r,
          y: CENTER.y + Math.sin(ang) * r,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 80,
          color: ['#00f2fe', '#8b5cf6', '#d946ef', '#f43f5e', '#ffffff'][i % 5]
        });
      }
    }

    // ============================================================
    // 3. FÍSICA EN TEMPS REAL
    // ============================================================
    function updatePhysics(dt) {
      if (!isRunning || hasEscaped) return;

      const SUB_STEPS = 6;
      const stepDt = dt / SUB_STEPS;

      for (let s = 0; s < SUB_STEPS; s++) {
        activeBall.vy += GRAVITY * stepDt;
        activeBall.x += activeBall.vx * stepDt;
        activeBall.y += activeBall.vy * stepDt;

        const curSpd = Math.hypot(activeBall.vx, activeBall.vy);
        if (curSpd > MAX_SPEED) {
          activeBall.vx = (activeBall.vx / curSpd) * MAX_SPEED;
          activeBall.vy = (activeBall.vy / curSpd) * MAX_SPEED;
        } else if (curSpd < MIN_SPEED && curSpd > 0.001) {
          activeBall.vx = (activeBall.vx / curSpd) * MIN_SPEED;
          activeBall.vy = (activeBall.vy / curSpd) * MIN_SPEED;
        }

        const dx = activeBall.x - CENTER.x;
        const dy = activeBall.y - CENTER.y;
        const dist = Math.hypot(dx, dy);

        let hitAng = Math.atan2(dy, dx);
        if (hitAng < 0) hitAng += Math.PI * 2;

        // 1. Rebot net contra les boles grises mortes
        let hitDead = false;
        for (let i = 0; i < deadBalls.length; i++) {
          const d = deadBalls[i];
          const ddx = activeBall.x - d.x;
          const ddy = activeBall.y - d.y;
          const ddist = Math.hypot(ddx, ddy);
          const minDist = BALL_RADIUS * 2;

          if (ddist < minDist && ddist > 0.001) {
            const fnx = ddx / ddist;
            const fny = ddy / ddist;
            const fdot = activeBall.vx * fnx + activeBall.vy * fny;

            if (fdot < 0) {
              activeBall.vx = (activeBall.vx - 2 * fdot * fnx) * BOUNCE_RESTITUTION;
              activeBall.vy = (activeBall.vy - 2 * fdot * fny) * BOUNCE_RESTITUTION;
              activeBall.x = d.x + fnx * minDist;
              activeBall.y = d.y + fny * minDist;
              recordSound('bounce', 1);
            }
            hitDead = true;
            break;
          }
        }

        if (hitDead) continue;

        // 2. Comprovació d'escletxa i punxes
        if (isInGap(hitAng)) {
          if (dist > ARENA_RADIUS + BALL_RADIUS + 10) {
            hasEscaped = true;
            isFinished = true;
            window.winnerName = currentBallNumber.toString();
            window.frozenCount = deadBalls.length;
            window.actualDuration = (performance.now() - startTime) / 1000;

            recordSound('reveal', 10);
            spawnRingShatter();

            setTimeout(() => {
              if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
              }
            }, 2600);
            return;
          }
        } else {
          // MOR TAN BON PUNT FREGA LA PUNTA D'UN SPIKE!
          if (dist + BALL_RADIUS >= R_SPIKE_TIPS) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);

            // La bola morta es queda a la punta, protegint la zona cap a l'interior
            const deadX = CENTER.x + nx * (R_SPIKE_TIPS + BALL_RADIUS * 0.15);
            const deadY = CENTER.y + ny * (R_SPIKE_TIPS + BALL_RADIUS * 0.15);

            deadBalls.push({ x: deadX, y: deadY });
            spawnDeathBurst(activeBall.x, activeBall.y, activeBall.color);
            recordSound('burst', 3);

            // Generar la següent bola amb la mateixa velocitat inicial
            currentBallNumber++;
            const nextColObj = NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)];

            activeBall = {
              x: SPAWN_X,
              y: SPAWN_Y,
              vx: INITIAL_VX,
              vy: INITIAL_VY,
              color: nextColObj.color,
              glow: nextColObj.glow,
              trail: []
            };
            break;
          }
        }
      }

      activeBall.trail.push({ x: activeBall.x, y: activeBall.y, color: activeBall.color });
      if (activeBall.trail.length > 14) activeBall.trail.shift();
    }

    // ============================================================
    // 4. RENDERITZAT VISUAL
    // ============================================================
    let lastTime = null;

    function render(currentTime) {
      if (!startTime) startTime = currentTime;
      if (!lastTime) lastTime = currentTime;
      const elapsed = (currentTime - startTime) / 1000;
      const dt = Math.min((currentTime - lastTime) / 1000, 0.05);
      lastTime = currentTime;

      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Títol superior en Lexend Bold
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '800 52px Lexend, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('TOUCH THE SPIKE', CENTER.x, 310);
      ctx.fillText('LOSE THE BALL', CENTER.x, 375);
      ctx.restore();

      // Dibuix de l'anell amb corona contínua de punxes (sense buits)
      if (!hasEscaped) {
        ctx.save();

        const gradient = ctx.createLinearGradient(
          CENTER.x - ARENA_RADIUS, CENTER.y - ARENA_RADIUS,
          CENTER.x + ARENA_RADIUS, CENTER.y + ARENA_RADIUS
        );
        gradient.addColorStop(0.0, '#3b82f6'); // Blau
        gradient.addColorStop(0.4, '#8b5cf6'); // Morat
        gradient.addColorStop(0.7, '#d946ef'); // Fúcsia
        gradient.addColorStop(1.0, '#f43f5e'); // Rosa-vermell

        ctx.strokeStyle = gradient;
        ctx.fillStyle = gradient;
        ctx.lineWidth = 4.5;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#d946ef';

        // 1. Cercle exterior (amb l'escletxa buida)
        ctx.beginPath();
        const startGap = GAP_ANGLE + GAP_SIZE / 2;
        const endGap = GAP_ANGLE - GAP_SIZE / 2 + Math.PI * 2;
        ctx.arc(CENTER.x, CENTER.y, ARENA_RADIUS, startGap, endGap);
        ctx.stroke();

        // 2. Corona contínua de punxes en ziga-zaga (sense cap calba)
        const spikeArc = (Math.PI * 2) - GAP_SIZE;
        const stepAngle = spikeArc / NUM_SPIKES;
        const startBaseAngle = GAP_ANGLE + GAP_SIZE / 2;

        ctx.beginPath();
        for (let i = 0; i <= NUM_SPIKES; i++) {
          const baseAngle = startBaseAngle + i * stepAngle;
          const bx = CENTER.x + Math.cos(baseAngle) * ARENA_RADIUS;
          const by = CENTER.y + Math.sin(baseAngle) * ARENA_RADIUS;

          if (i === 0) {
            ctx.moveTo(bx, by);
          } else {
            ctx.lineTo(bx, by);
          }

          if (i < NUM_SPIKES) {
            const tipAngle = baseAngle + stepAngle / 2;
            const tx = CENTER.x + Math.cos(tipAngle) * (ARENA_RADIUS - SPIKE_HEIGHT);
            const ty = CENTER.y + Math.sin(tipAngle) * (ARENA_RADIUS - SPIKE_HEIGHT);
            ctx.lineTo(tx, ty);
          }
        }
        ctx.stroke();

        ctx.restore();
      }

      // Partícules d'impacte
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.life / 6), 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);

      // Partícules d'explosió final
      ringShatterParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.life / 8), 0, Math.PI * 2);
        ctx.fill();
      });
      ringShatterParticles = ringShatterParticles.filter(p => p.life > 0);

      // BOLES GRISES MORTES (UNA SOLA RODONA GRISA SÒLIDA I MÉS GRAN)
      ctx.save();
      ctx.fillStyle = '#64748b'; // Gris sòlid net
      deadBalls.forEach(d => {
        ctx.beginPath();
        ctx.arc(d.x, d.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();

      // Estela de la bola activa
      activeBall.trail.forEach((pt, i) => {
        const alpha = (i + 1) / activeBall.trail.length;
        ctx.save();
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = alpha * 0.35;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, BALL_RADIUS * alpha * 0.85, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      ctx.globalAlpha = 1.0;

      // Bola activa viva (més gran)
      ctx.save();
      ctx.shadowBlur = 24;
      ctx.shadowColor = activeBall.glow;
      ctx.fillStyle = activeBall.color;
      ctx.beginPath();
      ctx.arc(activeBall.x, activeBall.y, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Pantalla de victòria final
      if (hasEscaped) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '900 76px Lexend, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#ffffff';
        ctx.fillText('ESCAPED! 🏆', CENTER.x, CENTER.y - 30);

        ctx.font = '800 36px Lexend, sans-serif';
        ctx.fillStyle = activeBall.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = activeBall.color;
        ctx.fillText(`AFTER ${deadBalls.length} SACRIFICES!`, CENTER.x, CENTER.y + 45);
        ctx.restore();
      }

      // Marcador inferior
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '800 36px Lexend, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`SACRIFICES: ${deadBalls.length}`, CENTER.x, HEIGHT - 330);

      ctx.font = '700 28px Lexend, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.fillText('@bouncelab.tv', CENTER.x, HEIGHT - 230);
      ctx.restore();

      updatePhysics(dt);
      requestAnimationFrame(render);
    }

    // ============================================================
    // 5. MEDIARECORDER
    // ============================================================
    let mediaRecorder;
    let recordedChunks = [];

    window.startRecording = function() {
      startTime = performance.now();
      isRunning = true;
      window.soundEvents = [];
      recordedChunks = [];

      const stream = canvas.captureStream(30);

      let mimeType = 'video/webm;codecs=vp8';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 4500000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          window.actualDuration = (performance.now() - startTime) / 1000;
          mediaRecorder.stop();
        }
      }, 75000);
    };

    document.fonts.ready.then(() => {
      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
