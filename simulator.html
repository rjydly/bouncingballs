<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ==========================================
    // 0. CONFIGURACIÓ GENERAL
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const RECORD_DURATION = parseInt(urlParams.get('duration') || '18', 10);

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

    // ==========================================
    // 1. SINTETITZADOR D'ÀUDIO PENTATÒNIC
    // ==========================================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    const audioDest = audioCtx.createMediaStreamDestination();

    // Notes harmòniques estil marimba
    const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

    function playNote(index, isEscape = false) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      const freq = isEscape ? 1174.66 : (PENTATONIC[index % PENTATONIC.length] || 523.25);
      osc.type = isEscape ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // Cop sec i percussiu
      const duration = isEscape ? 0.45 : 0.18;
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.connect(audioDest);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // ==========================================
    // 2. FÍSICA RÀPIDA I DINÀMICA (VIRAL STYLE)
    // ==========================================
    const GRAVITY = 0.55;            // Gravetat viva
    const BOUNCE_ACCEL = 1.018;      // La bola es fa més ràpida a cada rebot
    const MAX_SPEED = 38;            // Límit de velocitat màxima per mantenir control
    const BALL_RADIUS = 20;

    let ball = {
      x: CENTER.x,
      y: CENTER.y - 70,
      vx: (Math.random() > 0.5 ? 1 : -1) * (14 + Math.random() * 6), // Sortida ràpida
      vy: -12,
      trail: []
    };

    const RING_COUNT = 5;
    const BASE_RADIUS = 180;
    const SPACING = 75;
    let rings = [];

    for (let i = 0; i < RING_COUNT; i++) {
      const hue = (i * 55 + 20) % 360;
      rings.push({
        radius: BASE_RADIUS + i * SPACING,
        gapAngle: Math.random() * Math.PI * 2,
        gapSize: 0.70, // Obertura de ~40 graus
        speed: (Math.random() > 0.5 ? 1 : -1) * (0.024 + i * 0.006),
        hue: hue,
        color: `hsl(${hue}, 100%, 65%)`,
        alive: true,
        flash: 0 // Flaix neó en rebre xoc
      });
    }

    let particles = [];

    function spawnBurst(x, y, hue) {
      for (let i = 0; i < 45; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 6 + Math.random() * 14;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 35,
          color: `hsl(${hue}, 100%, 75%)`
        });
      }
    }

    // ==========================================
    // 3. MOTOR DE COL·LISIÓ SENSE TUNNELING
    // ==========================================
    function updatePhysics() {
      // 8 sub-passos per fotograma: precisió absoluta a altes velocitats
      const SUB_STEPS = 8;

      for (let s = 0; s < SUB_STEPS; s++) {
        ball.vy += GRAVITY / SUB_STEPS;
        ball.x += ball.vx / SUB_STEPS;
        ball.y += ball.vy / SUB_STEPS;

        // Limitar velocitat màxima si s'accelera massa
        const currentSpeed = Math.hypot(ball.vx, ball.vy);
        if (currentSpeed > MAX_SPEED) {
          ball.vx = (ball.vx / currentSpeed) * MAX_SPEED;
          ball.vy = (ball.vy / currentSpeed) * MAX_SPEED;
        }

        const dx = ball.x - CENTER.x;
        const dy = ball.y - CENTER.y;
        const dist = Math.hypot(dx, dy);

        // Vector normal cap enfora
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);

        // Angle d'impacte respecte al centre (0 a 2*PI)
        let hitAngle = Math.atan2(dy, dx);
        if (hitAngle < 0) hitAngle += Math.PI * 2;

        rings.forEach((ring, idx) => {
          if (!ring.alive) return;

          // La pilota es troba a l'anell
          const contactDist = ring.radius;
          const isTouching = Math.abs(dist - contactDist) <= BALL_RADIUS;

          if (isTouching) {
            // Càlcul de distància angular més curta a l'obertura (sense errors de 360 graus)
            let diff = Math.abs(hitAngle - ring.gapAngle) % (Math.PI * 2);
            if (diff > Math.PI) diff = Math.PI * 2 - diff;

            const inGap = diff <= (ring.gapSize / 2);

            if (inGap) {
              // ESCAPAT: Es trenca l'anell
              ring.alive = false;
              playNote(idx, true);
              spawnBurst(ball.x, ball.y, ring.hue);
            } else {
              // REBOT OBLIGATORI (Clamping de posició per evitar tunneling)
              const dot = ball.vx * nx + ball.vy * ny;

              // Si va cap enfora xocant des de dins:
              if (dist < contactDist && dot > 0) {
                ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                // FIXACIÓ DE POSICIÓ: La bola no pot traspassar la paret
                ball.x = CENTER.x + nx * (contactDist - BALL_RADIUS);
                ball.y = CENTER.y + ny * (contactDist - BALL_RADIUS);

                ring.flash = 1.0;
                playNote(idx, false);
              }
              // Si va cap endins xocant des de fora:
              else if (dist >= contactDist && dot < 0) {
                ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                ball.x = CENTER.x + nx * (contactDist + BALL_RADIUS);
                ball.y = CENTER.y + ny * (contactDist + BALL_RADIUS);

                ring.flash = 1.0;
                playNote(idx, false);
              }
            }
          }
        });
      }

      // Actualitzar rotació d'anells i efecte de flash
      rings.forEach(r => {
        if (r.alive) {
          r.gapAngle = (r.gapAngle + r.speed) % (Math.PI * 2);
          if (r.flash > 0) r.flash -= 0.05;
        }
      });

      // Estela
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 16) ball.trail.shift();
    }

    // ==========================================
    // 4. RENDERITZAT VISUAL NEÓ
    // ==========================================
    function render() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Dibuixar Anells
      rings.forEach(ring => {
        if (!ring.alive) return;
        ctx.save();

        const glowSize = ring.flash > 0 ? 30 : 15;
        ctx.shadowBlur = glowSize;
        ctx.shadowColor = ring.flash > 0 ? '#ffffff' : ring.color;
        ctx.strokeStyle = ring.flash > 0 ? '#ffffff' : ring.color;
        ctx.lineWidth = ring.flash > 0 ? 12 : 9;
        ctx.lineCap = 'round';

        ctx.beginPath();
        const start = ring.gapAngle + ring.gapSize / 2;
        const end = ring.gapAngle - ring.gapSize / 2 + Math.PI * 2;
        ctx.arc(CENTER.x, CENTER.y, ring.radius, start, end);
        ctx.stroke();
        ctx.restore();
      });

      // Estela de la pilota
      ball.trail.forEach((pt, i) => {
        const alpha = (i + 1) / ball.trail.length;
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.35})`;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, BALL_RADIUS * alpha * 0.75, 0, Math.PI * 2);
        ctx.fill();
      });

      // Partícules
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.life / 4), 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);

      // Pilota brillant
      ctx.save();
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#ffffff';
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Marca d'aigua pròpia al centre
      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.textAlign = 'center';
      ctx.fillText('bouncelab.tv', CENTER.x, CENTER.y + 12);

      // Ganxo de text superior estil TikTok
      ctx.font = '800 60px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 18;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
      ctx.fillText('WILL IT ESCAPE?', CENTER.x, 260);

      // Comptador d'anells restants inferior
      const remaining = rings.filter(r => r.alive).length;
      ctx.font = '700 36px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.shadowBlur = 0;
      ctx.fillText(`WALLS LEFT: ${remaining}`, CENTER.x, HEIGHT - 240);

      updatePhysics();
      requestAnimationFrame(render);
    }

    // ==========================================
    // 5. GRAVACIÓ AUTOMÀTICA
    // ==========================================
    let mediaRecorder;
    let recordedChunks = [];

    window.startRecording = function() {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      recordedChunks = [];
      const canvasStream = canvas.captureStream(60);
      const audioStream = audioDest.stream;
      const combined = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioStream.getAudioTracks()
      ]);

      let mimeType = 'video/webm;codecs=vp8,opus';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) {
        mimeType = 'video/webm;codecs=vp9,opus';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(combined, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      }, RECORD_DURATION * 1000);
    };

    render();
  </script>
</body>
</html>
