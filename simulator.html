<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ==========================================
    // 0. CONFIGURACIÓ GENERAL
    // ==========================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

    window.soundEvents = [];
    window.actualDuration = 0;
    let startTime = null;
    let globalFrame = 0;
    let isFinished = false;
    let isRunning = false; // CONGELAT FINS QUE COMENÇA LA GRAVACIÓ

    function recordSoundHit(noteIndex, isEscape) {
      if (startTime !== null) {
        const timeSec = (performance.now() - startTime) / 1000;
        window.soundEvents.push({
          time: timeSec,
          note: noteIndex,
          isEscape: isEscape
        });
      }
    }

    // ==========================================
    // 1. FÍSICA I PILOTES ASIMÈTRIQUES
    // ==========================================
    const GRAVITY = 0.75;
    const BOUNCE_ACCEL = 1.012;
    const MAX_SPEED = 46;
    const BALL_RADIUS = 18;

    // Angles completament asimètrics
    const angle1 = Math.random() * Math.PI * 2;
    const speed1 = 28 + Math.random() * 5;
    const angle2 = (angle1 + Math.PI * 0.45 + Math.random() * Math.PI * 0.7) % (Math.PI * 2);
    const speed2 = 28 + Math.random() * 5;

    let balls = [
      {
        id: 1,
        name: "CYAN",
        x: CENTER.x - 35,
        y: CENTER.y - 40,
        vx: Math.cos(angle1) * speed1,
        vy: Math.sin(angle1) * speed1,
        radius: BALL_RADIUS,
        color: '#00f2fe',
        glowColor: '#00f2fe',
        hueOffset: 0,
        trail: []
      },
      {
        id: 2,
        name: "PINK",
        x: CENTER.x + 35,
        y: CENTER.y - 40,
        vx: Math.cos(angle2) * speed2,
        vy: Math.sin(angle2) * speed2,
        radius: BALL_RADIUS,
        color: '#ff007f',
        glowColor: '#ff007f',
        hueOffset: 180,
        trail: []
      }
    ];

    // 4 ANELLS AMB FORAT DESAFIANT (24 graus per generar tensió i rebots)
    const RING_COUNT = 4;
    const BASE_RADIUS = 160;
    const SPACING = 72;
    let rings = [];

    for (let i = 0; i < RING_COUNT; i++) {
      const hue = (i * 65 + 20) % 360;
      rings.push({
        radius: BASE_RADIUS + i * SPACING,
        gapAngle: Math.random() * Math.PI * 2,
        gapSize: 0.42, // ~24 graus (precís, no massa fàcil)
        speed: (Math.random() > 0.5 ? 1 : -1) * (0.024 + i * 0.006),
        hue: hue,
        color: `hsl(${hue}, 100%, 65%)`,
        alive: true,
        flash: 0
      });
    }

    let particles = [];

    function spawnBurst(x, y, hue) {
      for (let i = 0; i < 50; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 8 + Math.random() * 16;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 40,
          color: `hsl(${hue}, 100%, 75%)`
        });
      }
    }

    // ==========================================
    // 2. FÍSICA BLINDADA SENSE FUGUES
    // ==========================================
    function updatePhysics() {
      if (!isRunning) return; // NO MOU RES FINS QUE ARRENCA LA GRAVACIÓ

      const SUB_STEPS = 8;
      globalFrame++;

      for (let s = 0; s < SUB_STEPS; s++) {
        balls.forEach(ball => {
          ball.vy += GRAVITY / SUB_STEPS;
          ball.x += ball.vx / SUB_STEPS;
          ball.y += ball.vy / SUB_STEPS;

          const currentSpeed = Math.hypot(ball.vx, ball.vy);
          if (currentSpeed > MAX_SPEED) {
            ball.vx = (ball.vx / currentSpeed) * MAX_SPEED;
            ball.vy = (ball.vy / currentSpeed) * MAX_SPEED;
          }

          const dx = ball.x - CENTER.x;
          const dy = ball.y - CENTER.y;
          const dist = Math.hypot(dx, dy);

          const nx = dx / (dist || 1);
          const ny = dy / (dist || 1);

          let hitAngle = Math.atan2(dy, dx);
          if (hitAngle < 0) hitAngle += Math.PI * 2;

          rings.forEach((ring, idx) => {
            if (!ring.alive) return;

            const contactDist = ring.radius;
            const isTouching = Math.abs(dist - contactDist) <= ball.radius;

            if (isTouching) {
              let diff = Math.abs(hitAngle - ring.gapAngle) % (Math.PI * 2);
              if (diff > Math.PI) diff = Math.PI * 2 - diff;

              const inGap = diff <= (ring.gapSize / 2);

              if (inGap) {
                ring.alive = false;
                recordSoundHit(idx, true);
                spawnBurst(ball.x, ball.y, ring.hue);
              } else {
                // BLINDATGE DE REBOT: Es basa en la direcció del vector de velocitat (dot)
                const dot = ball.vx * nx + ball.vy * ny;

                if (dot > 0) {
                  // La bola anava cap enfora -> rebot cap endins obligatori
                  ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                  ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                  ball.x = CENTER.x + nx * (contactDist - ball.radius);
                  ball.y = CENTER.y + ny * (contactDist - ball.radius);

                  ring.flash = 1.0;
                  recordSoundHit(idx, false);
                } else if (dot < 0) {
                  // La bola anava cap endins -> rebot cap enfora obligatori
                  ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                  ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                  ball.x = CENTER.x + nx * (contactDist + ball.radius);
                  ball.y = CENTER.y + ny * (contactDist + ball.radius);

                  ring.flash = 1.0;
                  recordSoundHit(idx, false);
                }
              }
            }
          });
        });

        // Xoc elàstic entre boles
        const b1 = balls[0], b2 = balls[1];
        const cdx = b2.x - b1.x;
        const cdy = b2.y - b1.y;
        const cDist = Math.hypot(cdx, cdy);
        const minDist = b1.radius + b2.radius;

        if (cDist < minDist && cDist > 0) {
          const cnx = cdx / cDist;
          const cny = cdy / cDist;
          const rvx = b1.vx - b2.vx;
          const rvy = b1.vy - b2.vy;
          const velAlongNorm = rvx * cnx + rvy * cny;

          if (velAlongNorm > 0) {
            b1.vx -= velAlongNorm * cnx;
            b1.vy -= velAlongNorm * cny;
            b2.vx += velAlongNorm * cnx;
            b2.vy += velAlongNorm * cny;

            const sep = (minDist - cDist) / 2;
            b1.x -= cnx * sep;
            b1.y -= cny * sep;
            b2.x += cnx * sep;
            b2.y += cny * sep;

            recordSoundHit(9, false);
          }
        }
      }

      rings.forEach(r => {
        if (r.alive) {
          r.gapAngle = (r.gapAngle + r.speed) % (Math.PI * 2);
          if (r.flash > 0) r.flash -= 0.05;
        }
      });

      balls.forEach(ball => {
        const curHue = (globalFrame * 5 + ball.hueOffset) % 360;
        ball.trail.push({ x: ball.x, y: ball.y, hue: curHue });
        if (ball.trail.length > 20) ball.trail.shift();
      });

      // Victòria: Quan tots 4 anells han estat trencats
      const allRingsCleared = rings.every(r => !r.alive);
      if (allRingsCleared && !isFinished) {
        isFinished = true;
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            window.actualDuration = (performance.now() - startTime) / 1000;
            mediaRecorder.stop();
          }
        }, 1800);
      }
    }

    // ==========================================
    // 3. RENDERITZAT VISUAL
    // ==========================================
    function render() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Anells Neó
      rings.forEach(ring => {
        if (!ring.alive) return;
        ctx.save();

        const glowSize = ring.flash > 0 ? 32 : 16;
        ctx.shadowBlur = glowSize;
        ctx.shadowColor = ring.flash > 0 ? '#ffffff' : ring.color;
        ctx.strokeStyle = ring.flash > 0 ? '#ffffff' : ring.color;
        ctx.lineWidth = ring.flash > 0 ? 13 : 9;
        ctx.lineCap = 'round';

        ctx.beginPath();
        const start = ring.gapAngle + ring.gapSize / 2;
        const end = ring.gapAngle - ring.gapSize / 2 + Math.PI * 2;
        ctx.arc(CENTER.x, CENTER.y, ring.radius, start, end);
        ctx.stroke();
        ctx.restore();
      });

      // Esteles Rainbow
      balls.forEach(ball => {
        ball.trail.forEach((pt, i) => {
          const alpha = (i + 1) / ball.trail.length;
          ctx.save();
          ctx.shadowBlur = 14;
          ctx.shadowColor = `hsl(${pt.hue}, 100%, 60%)`;
          ctx.fillStyle = `hsla(${pt.hue}, 100%, 65%, ${alpha * 0.60})`;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, ball.radius * alpha * 0.85, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      });

      // Partícules
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.life / 4), 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);

      // Pilotes
      balls.forEach(ball => {
        ctx.save();
        ctx.shadowBlur = 25;
        ctx.shadowColor = ball.glowColor;
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Marca d'aigua
      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.textAlign = 'center';
      ctx.fillText('bouncelab.tv', CENTER.x, CENTER.y + 12);

      // Ganxo de text
      ctx.font = '800 62px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 18;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
      ctx.textAlign = 'center';

      if (isFinished) {
        ctx.fillStyle = '#93d119';
        ctx.shadowColor = '#93d119';
        ctx.fillText('ESCAPED! 🏆', CENTER.x, 240);
      } else {
        ctx.fillText('WHICH ONE ESCAPES?', CENTER.x, 240);
        ctx.font = '700 32px sans-serif';
        ctx.fillStyle = '#00f2fe';
        ctx.fillText('CYAN', CENTER.x - 110, 292);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('vs', CENTER.x, 292);
        ctx.fillStyle = '#ff007f';
        ctx.fillText('PINK', CENTER.x + 110, 292);
      }

      // Comptador d'anells
      const remaining = rings.filter(r => r.alive).length;
      ctx.font = '700 36px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.shadowBlur = 0;
      ctx.fillText(`WALLS LEFT: ${remaining}`, CENTER.x, HEIGHT - 240);

      updatePhysics();
      requestAnimationFrame(render);
    }

    // ==========================================
    // 4. GRAVADOR SINCRONITZAT AL SEGON 0
    // ==========================================
    let mediaRecorder;
    let recordedChunks = [];

    window.startRecording = function() {
      // Arrenca exactament quan comença el gravador
      startTime = performance.now();
      isRunning = true;
      window.soundEvents = [];
      recordedChunks = [];

      const stream = canvas.captureStream(60);

      let mimeType = 'video/webm;codecs=vp8';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      // Topall màxim de 60 segons per seguretat
      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          window.actualDuration = (performance.now() - startTime) / 1000;
          mediaRecorder.stop();
        }
      }, 60000);
    };

    // Dibuixa l'escena inicial estàtica
    render();
  </script>
</body>
</html>
