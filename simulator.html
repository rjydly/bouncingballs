<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BounceLab Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1080" height="1920"></canvas>

  <script>
    // ==========================================
    // 0. CONFIGURACIÓ GENERAL
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const RECORD_DURATION = parseInt(urlParams.get('duration') || '30', 10);
    const RING_COUNT = parseInt(urlParams.get('rings') || '7', 10);
    const TWO_BALLS = urlParams.get('twoBalls') !== '0'; // Per defecte: Dues pilotes

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1080, HEIGHT = 1920;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

    window.soundEvents = [];
    let startTime = null;
    let globalFrame = 0;

    function recordSoundHit(noteIndex, isEscape) {
      if (startTime !== null) {
        const timeSec = (performance.now() - startTime) / 1000;
        window.soundEvents.push({
          time: timeSec,
          note: noteIndex,
          isEscape: isEscape
        });
      }
    }

    // ==========================================
    // 1. CONFIGURACIÓ DE LES PILOTES
    // ==========================================
    const GRAVITY = 0.58;
    const BOUNCE_ACCEL = 1.016;
    const MAX_SPEED = 38;
    const BALL_RADIUS = 18;

    let balls = [
      {
        id: 1,
        name: "CYAN",
        x: CENTER.x - 45,
        y: CENTER.y - 60,
        vx: 16,
        vy: -14,
        radius: BALL_RADIUS,
        color: '#00f2fe',
        glowColor: '#00f2fe',
        hueOffset: 0,
        trail: []
      }
    ];

    if (TWO_BALLS) {
      balls.push({
        id: 2,
        name: "PINK",
        x: CENTER.x + 45,
        y: CENTER.y - 60,
        vx: -16,
        vy: -14,
        radius: BALL_RADIUS,
        color: '#ff007f',
        glowColor: '#ff007f',
        hueOffset: 180, // Colors oposats a l'arc de Sant Martí
        trail: []
      });
    }

    // 7 Anells concèntrics
    const BASE_RADIUS = 150;
    const SPACING = 54;
    let rings = [];

    for (let i = 0; i < RING_COUNT; i++) {
      const hue = (i * 48 + 15) % 360;
      rings.push({
        radius: BASE_RADIUS + i * SPACING,
        gapAngle: Math.random() * Math.PI * 2,
        gapSize: 0.65, // Obertura de ~37 graus
        speed: (Math.random() > 0.5 ? 1 : -1) * (0.022 + i * 0.005),
        hue: hue,
        color: `hsl(${hue}, 100%, 65%)`,
        alive: true,
        flash: 0
      });
    }

    let particles = [];

    function spawnBurst(x, y, hue) {
      for (let i = 0; i < 45; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 6 + Math.random() * 14;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 35,
          color: `hsl(${hue}, 100%, 75%)`
        });
      }
    }

    // ==========================================
    // 2. FÍSICA I DETECCIÓ DE COL·LISIÓ
    // ==========================================
    function updatePhysics() {
      const SUB_STEPS = 8;
      globalFrame++;

      for (let s = 0; s < SUB_STEPS; s++) {
        // 1. Moure cada pilota
        balls.forEach(ball => {
          ball.vy += GRAVITY / SUB_STEPS;
          ball.x += ball.vx / SUB_STEPS;
          ball.y += ball.vy / SUB_STEPS;

          const currentSpeed = Math.hypot(ball.vx, ball.vy);
          if (currentSpeed > MAX_SPEED) {
            ball.vx = (ball.vx / currentSpeed) * MAX_SPEED;
            ball.vy = (ball.vy / currentSpeed) * MAX_SPEED;
          }

          const dx = ball.x - CENTER.x;
          const dy = ball.y - CENTER.y;
          const dist = Math.hypot(dx, dy);

          const nx = dx / (dist || 1);
          const ny = dy / (dist || 1);

          let hitAngle = Math.atan2(dy, dx);
          if (hitAngle < 0) hitAngle += Math.PI * 2;

          // Col·lisió amb anells
          rings.forEach((ring, idx) => {
            if (!ring.alive) return;

            const contactDist = ring.radius;
            const isTouching = Math.abs(dist - contactDist) <= ball.radius;

            if (isTouching) {
              let diff = Math.abs(hitAngle - ring.gapAngle) % (Math.PI * 2);
              if (diff > Math.PI) diff = Math.PI * 2 - diff;

              const inGap = diff <= (ring.gapSize / 2);

              if (inGap) {
                ring.alive = false;
                recordSoundHit(idx, true);
                spawnBurst(ball.x, ball.y, ring.hue);
              } else {
                const dot = ball.vx * nx + ball.vy * ny;

                if (dist < contactDist && dot > 0) {
                  ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                  ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                  ball.x = CENTER.x + nx * (contactDist - ball.radius);
                  ball.y = CENTER.y + ny * (contactDist - ball.radius);

                  ring.flash = 1.0;
                  recordSoundHit(idx, false);
                } else if (dist >= contactDist && dot < 0) {
                  ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE_ACCEL;
                  ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE_ACCEL;
                  ball.x = CENTER.x + nx * (contactDist + ball.radius);
                  ball.y = CENTER.y + ny * (contactDist + ball.radius);

                  ring.flash = 1.0;
                  recordSoundHit(idx, false);
                }
              }
            }
          });
        });

        // 2. Col·lisió elàstica entre les dues pilotes si xoquen
        if (balls.length === 2) {
          const b1 = balls[0], b2 = balls[1];
          const cdx = b2.x - b1.x;
          const cdy = b2.y - b1.y;
          const cDist = Math.hypot(cdx, cdy);
          const minDist = b1.radius + b2.radius;

          if (cDist < minDist && cDist > 0) {
            const cnx = cdx / cDist;
            const cny = cdy / cDist;
            const rvx = b1.vx - b2.vx;
            const rvy = b1.vy - b2.vy;
            const velAlongNorm = rvx * cnx + rvy * cny;

            if (velAlongNorm > 0) {
              b1.vx -= velAlongNorm * cnx;
              b1.vy -= velAlongNorm * cny;
              b2.vx += velAlongNorm * cnx;
              b2.vy += velAlongNorm * cny;

              const sep = (minDist - cDist) / 2;
              b1.x -= cnx * sep;
              b1.y -= cny * sep;
              b2.x += cnx * sep;
              b2.y += cny * sep;

              recordSoundHit(9, false); // So agut en xocar entre elles
            }
          }
        }
      }

      // 3. Rotació d'anells
      rings.forEach(r => {
        if (r.alive) {
          r.gapAngle = (r.gapAngle + r.speed) % (Math.PI * 2);
          if (r.flash > 0) r.flash -= 0.05;
        }
      });

      // 4. Afegir punt a l'Estela Multicolor (Rainbow Trail)
      balls.forEach(ball => {
        const curHue = (globalFrame * 4 + ball.hueOffset) % 360;
        ball.trail.push({ x: ball.x, y: ball.y, hue: curHue });
        if (ball.trail.length > 22) ball.trail.shift();
      });
    }

    // ==========================================
    // 3. RENDERITZAT VISUAL NEÓ + RAINBOW
    // ==========================================
    function render() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Dibuixar Anells Neó
      rings.forEach(ring => {
        if (!ring.alive) return;
        ctx.save();

        const glowSize = ring.flash > 0 ? 30 : 15;
        ctx.shadowBlur = glowSize;
        ctx.shadowColor = ring.flash > 0 ? '#ffffff' : ring.color;
        ctx.strokeStyle = ring.flash > 0 ? '#ffffff' : ring.color;
        ctx.lineWidth = ring.flash > 0 ? 12 : 9;
        ctx.lineCap = 'round';

        ctx.beginPath();
        const start = ring.gapAngle + ring.gapSize / 2;
        const end = ring.gapAngle - ring.gapSize / 2 + Math.PI * 2;
        ctx.arc(CENTER.x, CENTER.y, ring.radius, start, end);
        ctx.stroke();
        ctx.restore();
      });

      // Dibuixar Esteles d'Arc de Sant Martí (Rainbow Trail)
      balls.forEach(ball => {
        ball.trail.forEach((pt, i) => {
          const alpha = (i + 1) / ball.trail.length;
          ctx.save();
          ctx.shadowBlur = 14;
          ctx.shadowColor = `hsl(${pt.hue}, 100%, 60%)`;
          ctx.fillStyle = `hsla(${pt.hue}, 100%, 65%, ${alpha * 0.60})`;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, ball.radius * alpha * 0.85, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      });

      // Partícules
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.life / 4), 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);

      // Dibuixar Pilotes amb resplendor
      balls.forEach(ball => {
        ctx.save();
        ctx.shadowBlur = 25;
        ctx.shadowColor = ball.glowColor;
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Marca d'aigua bouncelab.tv
      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.textAlign = 'center';
      ctx.fillText('bouncelab.tv', CENTER.x, CENTER.y + 12);

      // Ganxo de text de tensió viral
      ctx.font = '800 60px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 18;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
      ctx.textAlign = 'center';

      if (balls.length === 2) {
        ctx.fillText('WHICH ONE ESCAPES?', CENTER.x, 240);
        // Indicador de colors Cyan vs Pink
        ctx.font = '700 32px sans-serif';
        ctx.fillStyle = '#00f2fe';
        ctx.fillText('CYAN', CENTER.x - 110, 290);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('vs', CENTER.x, 290);
        ctx.fillStyle = '#ff007f';
        ctx.fillText('PINK', CENTER.x + 110, 290);
      } else {
        ctx.fillText('WILL IT ESCAPE?', CENTER.x, 260);
      }

      // Comptador d'anells restants inferior
      const remaining = rings.filter(r => r.alive).length;
      ctx.font = '700 36px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.shadowBlur = 0;
      ctx.fillText(`WALLS LEFT: ${remaining}`, CENTER.x, HEIGHT - 240);

      updatePhysics();
      requestAnimationFrame(render);
    }

    // ==========================================
    // 4. GRAVADOR INTEGRAT
    // ==========================================
    let mediaRecorder;
    let recordedChunks = [];

    window.startRecording = function() {
      startTime = performance.now();
      window.soundEvents = [];
      recordedChunks = [];

      const stream = canvas.captureStream(60);

      let mimeType = 'video/webm;codecs=vp8';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      mediaRecorder.start();

      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      }, RECORD_DURATION * 1000);
    };

    render();
  </script>
</body>
</html>
