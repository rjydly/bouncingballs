name: Generate and Send Daily Video

on:
  schedule:
    # S'executa automàticament cada dia a les 10:00 UTC (12:00h peninsular)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permet executar-lo manualment amb un sol clic

jobs:
  render_and_send:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instal·lar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instal·lar llibreries Python
        run: pip install -r requirements.txt

      - name: Instal·lar navegador Firefox per Playwright
        run: playwright install --with-deps firefox

      - name: Generar vídeo dinàmic i enviar a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
