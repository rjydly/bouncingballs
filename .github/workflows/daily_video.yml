name: Generate and Send Daily Video

on:
  schedule:
    # S'executa automàticament cada dia a les 10:00 UTC (12:00h peninsular)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durada del vídeo en segons'
        required: true
        default: '30'
        type: choice
        options:
          - '20'
          - '30'
          - '45'
          - '60'
      rings:
        description: 'Nombre danells'
        required: true
        default: '7'
        type: choice
        options:
          - '5'
          - '6'
          - '7'
          - '8'
      two_balls:
        description: 'Dues pilotes enfrontades'
        required: true
        default: '1'
        type: choice
        options:
          - '1' # Sí (Cyan vs Pink)
          - '0' # No (1 sola pilota)

jobs:
  render_and_send:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instal·lar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instal·lar llibreries Python
        run: pip install -r requirements.txt

      - name: Instal·lar navegador Firefox per Playwright
        run: playwright install --with-deps firefox

      - name: Generar vídeo i enviar a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DURATION: ${{ github.event.inputs.duration || '30' }}
          RINGS: ${{ github.event.inputs.rings || '7' }}
          TWO_BALLS: ${{ github.event.inputs.two_balls || '1' }}
        run: python main.py
