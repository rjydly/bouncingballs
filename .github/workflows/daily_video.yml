name: Generate and Multi-Publish Viral Video

on:
  schedule:
    # 3 cops al dia (Hora EUA: 10:00 AM, 3:00 PM i 7:00 PM EDT)
    - cron: '0 14,19,23 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Mode Prova (Només envia a Telegram, no publica)?'
        required: true
        default: false
        type: boolean
      render_3d_spiral:
        description: 'Executar la prova 3D de les boletes (generate_spiral.py)?'
        required: true
        default: false
        type: boolean
      mode:
        description: 'Mode 2D habitual (si no s executant el 3D):'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - multiply
          - spikes
          - accumulation
          - tracker
          - classic
      force_snapchat:
        description: 'Forçar publicació a Snapchat en aquest llançament?'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  render_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instal·lar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instal·lar Blender
        run: sudo snap install blender --classic

      - name: Instal·lar dependències Python
        run: pip install -r requirements.txt

      - name: Instal·lar Firefox per a Playwright (només per al sistema 2D)
        if: ${{ github.event.inputs.render_3d_spiral != 'true' }}
        run: playwright install --with-deps firefox

      # EXECUCIÓ 1: PROVA 3D DE LES BOLETES
      - name: Executar generador 3D (Boletes)
        if: ${{ github.event.inputs.render_3d_spiral == 'true' }}
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_spiral.py

      # EXECUCIÓ 2: SISTEMA HABITUAL 2D
      - name: Executar generador 2D i distribuïdor social
        if: ${{ github.event.inputs.render_3d_spiral != 'true' }}
        env:
          GITHUB_REPO: ${{ github.repository }}
          SELECTED_MODE: ${{ github.event.inputs.mode || 'auto' }}
          FORCE_SNAPCHAT: ${{ github.event.inputs.force_snapchat || 'false' }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
          ZERNIO_FACEBOOK_ACCOUNT_ID: ${{ secrets.ZERNIO_FACEBOOK_ACCOUNT_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUNDLE_SOCIAL_API_KEY: ${{ secrets.BUNDLE_SOCIAL_API_KEY }}
          BUNDLE_SOCIAL_TEAM_ID: ${{ secrets.BUNDLE_SOCIAL_TEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
